name: Fetch Hot Sectors

on:
  schedule:
    # 台灣時間 09:00~13:59（UTC 01~05）每5分鐘
    - cron: '*/5 1-5 * * 1-5'

    # 週一~五 非盤中 每1小時
    - cron: '0 */1 * * 1-5'

    # 週末 每1小時
    - cron: '0 */1 * * 0,6'

  push:
    branches: [main]

  workflow_dispatch:

jobs:
  fetch-sectors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Fetch and push sectors to Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: 92fabe69cac1471ea9c22e9ec7ea9a44
          CF_KV_TOKEN: ${{ secrets.WORKER_KV_WRITE_TOKEN }}
        run: python fetch_sectors.py