<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>強勢股新聞雷達</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7;
    --bg2: #ffffff;
    --bg3: #f0f2f5;
    --bg4: #e8ebf0;
    --border: #e2e5eb;
    --border2: #c8cdd8;
    --text: #1a1d24;
    --text2: #5a6276;
    --text3: #9aa0b2;
    --green: #00a651;
    --green2: #008a44;
    --green-bg: rgba(0,166,81,0.07);
    --green-bg2: rgba(0,166,81,0.13);
    --red: #d9363e;
    --red2: #b52c33;
    --red-bg: rgba(217,54,62,0.07);
    --red-bg2: rgba(217,54,62,0.13);
    --amber: #c47d00;
    --amber-bg: rgba(196,125,0,0.09);
    --blue: #1a6fcc;
    --blue-bg: rgba(26,111,204,0.08);
    --accent: #2563eb;
    --accent-bg: rgba(37,99,235,0.09);
    --nav-h: 52px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* NAV */
  nav {
    height: var(--nav-h);
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 4px;
  }

  .nav-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--green);
    letter-spacing: 0.05em;
    margin-right: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .nav-logo::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    animation: blink 1.5s infinite;
  }

  @keyframes blink {
    0%,100% { opacity:1; }
    50% { opacity:0.2; }
  }

  .nav-link {
    padding: 6px 12px;
    font-size: 13px;
    color: var(--text2);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .nav-link:hover { color: var(--text); background: var(--bg3); }

  .nav-link.active {
    color: var(--text);
    background: var(--bg4);
    border-color: var(--border2);
  }

  /* MAIN */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* PAGE TITLE */
  .page-header {
    margin-bottom: 20px;
  }

  .page-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .page-desc {
    font-size: 13px;
    color: var(--text2);
  }

  .page-desc span {
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .status-info {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--text2);
  }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dot.green { background: var(--green); }
  .dot.amber { background: var(--amber); }
  .dot.red { background: var(--red); }

  .status-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text);
    transition: all 0.15s;
    font-family: inherit;
  }

  .btn:hover { background: var(--bg4); border-color: var(--accent); }

  .btn-primary {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--blue);
  }

  .btn-primary:hover { background: rgba(91,141,248,0.2); }

  /* SORT BAR */
  .sort-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .sort-label { font-size: 12px; color: var(--text3); }

  .sort-btn {
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    transition: all 0.15s;
    font-family: inherit;
  }

  .sort-btn:hover { border-color: var(--border2); color: var(--text); }
  .sort-btn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--blue); }

  /* STOCK CARD */
  .stock-list { display: flex; flex-direction: column; gap: 10px; }

  .stock-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    transition: border-color 0.15s;
    cursor: pointer;
  }

  .stock-card:hover { border-color: var(--border2); }

  .stock-card.up { border-left: 3px solid var(--green); }
  .stock-card.limit { border-left: 3px solid var(--red); }

  .stock-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 12px;
  }

  .stock-id {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .stock-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .stock-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .badge {
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }

  .badge-limit { background: var(--red-bg2); color: var(--red); border: 1px solid rgba(255,68,68,0.3); }
  .badge-up { background: var(--green-bg2); color: var(--green); border: 1px solid rgba(0,230,118,0.3); }
  .badge-sector { background: var(--bg4); color: var(--text2); border: 1px solid var(--border2); }
  .badge-new { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(255,179,0,0.3); }
  .badge-blue { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(79,195,247,0.3); }

  .stock-price-area {
    text-align: right;
    flex-shrink: 0;
  }

  .stock-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    color: var(--green);
    line-height: 1;
    margin-bottom: 2px;
  }

  .stock-price.red { color: var(--red); }

  .stock-change {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--green);
  }

  .stock-change.red { color: var(--red); }

  .stock-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 8px;
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .meta-val { color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .meta-val.green { color: var(--green); }
  .meta-val.amber { color: var(--amber); }

  /* NEWS SNIPPET */
  .news-snippet {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 8px;
  }

  .news-snippet-title {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 4px;
    line-height: 1.4;
  }

  .news-snippet-meta {
    font-size: 11px;
    color: var(--text3);
    display: flex;
    gap: 8px;
  }

  /* CHART MINI */
  .mini-chart {
    height: 36px;
    width: 80px;
    flex-shrink: 0;
  }

  /* EMPTY / LOADING */
  .loading-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 40px;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
  }

  /* HOT SECTORS */
  .sector-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .sector-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    transition: border-color 0.15s;
  }

  .sector-card:hover { border-color: var(--border2); }

  .sector-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .sector-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sector-heat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--amber);
    background: var(--amber-bg);
    border: 1px solid rgba(255,179,0,0.25);
    padding: 2px 7px;
    border-radius: 4px;
  }

  .sector-stocks {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 8px;
  }

  .sector-stock-chip {
    padding: 3px 8px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    border-radius: 4px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }

  .sector-stock-chip:hover { border-color: var(--green); color: var(--green); }

  .sector-news {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.5;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    margin-top: 4px;
  }

  .sector-time {
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 4px;
  }

  /* US STOCKS */
  .us-table {
    width: 100%;
    border-collapse: collapse;
  }

  .us-table th {
    text-align: left;
    padding: 8px 12px;
    font-size: 11px;
    color: var(--text3);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
  }

  .us-table th:hover { color: var(--text2); }
  .us-table th.active { color: var(--accent); }

  .us-table td {
    padding: 10px 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .us-table tr:hover td { background: var(--bg3); }

  .us-table tr:last-child td { border-bottom: none; }

  .us-rank {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text3);
    width: 30px;
  }

  .us-symbol {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    color: var(--text);
  }

  .us-name { color: var(--text2); }
  .us-price { font-family: 'JetBrains Mono', monospace; color: var(--text); }
  .us-vol { font-family: 'JetBrains Mono', monospace; color: var(--amber); }

  .up-val { color: var(--green); font-family: 'JetBrains Mono', monospace; }
  .dn-val { color: var(--red); font-family: 'JetBrains Mono', monospace; }

  /* TW NEWS */
  .news-list { display: flex; flex-direction: column; gap: 8px; }

  .news-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .news-card:hover { border-color: var(--border2); }

  .news-card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 6px;
  }

  .news-card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text3);
  }

  .news-source { color: var(--accent); }

  /* GUIDE */
  .guide-content {
    max-width: 720px;
  }

  .guide-hero {
    background: linear-gradient(135deg, var(--bg3) 0%, var(--bg4) 100%);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 24px;
  }

  .guide-hero-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }

  .guide-hero-sub {
    font-size: 13px;
    color: var(--text2);
  }

  .guide-section {
    margin-bottom: 24px;
  }

  .guide-section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .guide-section-title::before {
    content: '';
    width: 3px;
    height: 16px;
    background: var(--green);
    border-radius: 2px;
  }

  .sop-steps { display: flex; flex-direction: column; gap: 10px; }

  .sop-step {
    display: flex;
    gap: 14px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .step-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent-bg);
    border: 1px solid var(--accent);
    color: var(--blue);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }

  .step-content {}

  .step-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .step-desc {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
  }

  .exit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }

  .exit-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    border-top: 2px solid var(--red);
  }

  .exit-card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--red);
    margin-bottom: 6px;
  }

  .exit-card-desc {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.6;
  }

  /* AFTER HOURS */
  .after-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .stat-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value { font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--green); }
  .stat-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* MINI SPARKLINE */
  canvas.spark { display: block; }

  /* SCROLL */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* TABLE WRAPPER */
  .table-wrap {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    overflow-x: auto;
  }

  /* SYNC STATUS */
  .sync-bar {
    background: var(--green-bg);
    border: 1px solid rgba(0,230,118,0.2);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace;
  }

  .pulse-dot {
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: blink 1.2s infinite;
    flex-shrink: 0;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    align-items: center;
  }

  .filter-btn {
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    transition: all 0.15s;
    font-family: inherit;
  }

  .filter-btn:hover { border-color: var(--border2); color: var(--text); }
  .filter-btn.active { background: var(--green-bg); border-color: rgba(0,230,118,0.4); color: var(--green); }

  .time-label {
    font-size: 12px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    margin-left: auto;
  }
</style>
</head>

function spark(canvas, up) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const pts = Array.from({length:12},(_,i)=> {
    const noise = (Math.random()-0.5)*0.3;
    return up ? 0.7 - i*(0.05+noise) : 0.3 + i*(0.05+noise);
  }).reverse();
  const min = Math.min(...pts), max = Math.max(...pts);
  const range = max - min || 1;
  ctx.beginPath();
  pts.forEach((v,i)=>{
    const x = i/(pts.length-1)*w;
    const y = h - ((v-min)/range)*(h-4) - 2;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.strokeStyle = up ? '#00e676' : '#ff4444';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function fmtChg(v) {
  return (v>0?'+':'')+v.toFixed(2)+'%';

// ── Google News RSS：個股新聞 ─────────────────────
const newsCache = {};

// 指定媒體白名單
const NEWS_MEDIA = ['工商時報','鉅亨網','Yahoo','經濟日報','中國時報','時報資訊','旺德富','旺得富','富聯網','時報'];

async function fetchStockNews(code, name, prefix='qj') {
  const elId = `news-${prefix}-${code}`;
  const el = document.getElementById(elId);
  if (!el) return;

  // 已快取就直接渲染
  if (newsCache[code]) { renderStockNews(el, newsCache[code]); return; }

  const PROXY = 'https://corsproxy.io/?url=';
  const query = encodeURIComponent(`${code} ${name} when:7d`);
  const rssUrl = `https://news.google.com/rss/search?q=${query}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;

  try {
    const res = await fetch(PROXY + encodeURIComponent(rssUrl));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, 'text/xml');

    const allItems = Array.from(xml.querySelectorAll('item')).map(item => {
      // 取得來源名稱：先從 source 標籤，再從標題後綴判斷
      let src = item.querySelector('source')?.textContent || '';
      const rawTitle = item.querySelector('title')?.textContent || '';
      if (!src && rawTitle.includes(' - ')) {
        src = rawTitle.split(' - ').pop().trim();
      }
      // 清理標題：去掉尾巴的「 - 媒體名稱」
      const title = rawTitle.includes(' - ') ? rawTitle.split(' - ').slice(0,-1).join(' - ').trim() : rawTitle;
      return {
        title,
        link: item.querySelector('link')?.textContent || '#',
        pub:  item.querySelector('pubDate')?.textContent || '',
        src,
      };
    });

    // 過濾指定媒體，最多取 10 則
    let filtered = allItems.filter(n => NEWS_MEDIA.some(m => n.src.includes(m)));
    // 若指定媒體不足 10 則，補充其他來源
    if (filtered.length < 10) {
      const extra = allItems.filter(n => !NEWS_MEDIA.some(m => n.src.includes(m)));
      filtered = [...filtered, ...extra].slice(0, 10);
    } else {
      filtered = filtered.slice(0, 10);
    }

    newsCache[code] = filtered;
    renderStockNews(el, filtered);
  } catch(e) {
    el.innerHTML = '<div style="font-size:11px;color:var(--text3);">⚠️ 新聞載入失敗，請稍後重試</div>';
  }
}

function renderStockNews(el, items) {
  if (!items.length) {
    el.innerHTML = '<div style="font-size:11px;color:var(--text3);">目前無相關新聞</div>';
    return;
  }
  el.innerHTML = items.map(n => {
    // 格式化時間
    const d = new Date(n.pub);
    const timeStr = isNaN(d) ? '' : d.toLocaleString('zh-TW', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `
<a href="${n.link}" target="_blank" rel="noopener" style="text-decoration:none;display:block;margin-bottom:6px;">
  <div style="padding:8px 10px;background:var(--bg3);border-radius:6px;border:1px solid var(--border);transition:border-color 0.15s;" onmouseover="this.style.borderColor='var(--border2)'" onmouseout="this.style.borderColor='var(--border)'">
    <div style="font-size:12px;color:var(--text);line-height:1.4;margin-bottom:3px;">${n.title}</div>
    <div style="font-size:11px;color:var(--text3);display:flex;gap:8px;">
      <span style="color:var(--accent);">${n.src}</span>
      <span>${timeStr}</span>
    </div>
  </div>
</a>`;
  }).join('');
}

function loadAllStockNews(stocks, prefix='qj') {
  // 依序載入避免同時大量請求
  stocks.forEach((s, i) => {
    setTimeout(() => fetchStockNews(s.code, s.name, prefix), i * 400);
  });
}

// ── 富聯網：熱門族群 ──────────────────────────────
async function fetchSectors() {
  const statusEl = document.getElementById('sectors-sync-status');
  const contentEl = document.getElementById('sectors-content');
  if (!contentEl) return;

  try {
    const res = await fetch('https://stockradar-worker.lucastockradar.workers.dev/api/sectors');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const items = await res.json();

    if (!items.length) {
      contentEl.innerHTML = '<div class="loading-card">目前無熱門族群新聞，請稍後再試</div>';
      if (statusEl) statusEl.textContent = '同步完成，目前無熱門族群新聞';
      return;
    }

    const now = new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    if (statusEl) statusEl.textContent = `同步完成 ／ 更新於 ${now} ／ 共 ${items.length} 則熱門族群新聞`;

    contentEl.innerHTML = `
<div class="news-list">
  ${items.map((n, i) => `
  <div class="news-card" style="animation:fadeIn 0.2s ease ${i * 0.03}s both;cursor:pointer;" onclick="window.open('${n.url}', '_blank')">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
      <span class="badge badge-new">熱門族群</span>
      <span style="font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;">${n.time}</span>
    </div>
    <div class="news-card-title">${n.title}</div>
    <div class="news-card-meta">
      <span class="news-source">${n.src || '富聯網'}</span>
      <span style="color:var(--accent);font-size:11px;">→ 點擊閱讀全文</span>
    </div>
  </div>`).join('')}
</div>
<style>@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>`;

  } catch (err) {
    console.error('fetchSectors error:', err);
    if (statusEl) statusEl.textContent = '載入失敗，請稍後再試';
    contentEl.innerHTML = `
<div class="loading-card">
  ⚠️ 無法載入資料<br>
  <span style="font-size:12px;margin-top:6px;display:block;">請稍後再試</span>
  <button class="btn btn-primary" style="margin-top:12px;" onclick="fetchSectors()">重試</button>
</div>`;
  }
}

// ── 鉅亨網：台股新聞 API ─────────────────────────
async function fetchCnyes() {
  const statusEl = document.getElementById('news-sync-status');
  const contentEl = document.getElementById('news-content');
  if (!contentEl) return;

  // 鉅亨網有公開的新聞 API（非官方但穩定）
  try {
    const res = await fetch('https://stockradar-worker.lucastockradar.workers.dev/api/news');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();

    // Workers 回傳的是已整理好的陣列，直接使用
    const items = Array.isArray(json) ? json : (json?.items?.data || []).map(n => ({
      title: n.title,
      time: new Date(n.publishAt * 1000).toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}),
      url: `https://news.cnyes.com/news/id/${n.newsId}`,
      cat: (n.categoryName || '').split(',')[0].trim(),
    }));

    if (items.length === 0) {
      contentEl.innerHTML = '<div class="loading-card">目前無新聞資料</div>';
      return;
    }

    const now = new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    if (statusEl) statusEl.textContent = `鉅亨網同步完成 ／ 更新於 ${now} ／ 共 ${items.length} 則`;

    contentEl.innerHTML = `
<div class="news-list">
  ${items.map((n, i) => `
  <a href="${n.url}" target="_blank" rel="noopener" style="text-decoration:none;">
    <div class="news-card" style="animation:fadeIn 0.2s ease ${i * 0.02}s both">
      <div class="news-card-title">${n.title}</div>
      <div class="news-card-meta">
        <span class="news-source">鉅亨網</span>
        <span style="font-family:'JetBrains Mono',monospace;">${n.time}</span>
        ${n.cat ? `<span class="badge badge-sector">${n.cat}</span>` : ''}
        <span style="color:var(--accent);font-size:11px;margin-left:auto;">→ 閱讀全文</span>
      </div>
    </div>
  </a>`).join('')}
</div>
<style>@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>`;

  } catch (err) {
    console.error('fetchCnyes error:', err);
    if (statusEl) statusEl.textContent = '載入失敗，請稍後再試';
    contentEl.innerHTML = `
<div class="loading-card">
  ⚠️ 無法載入鉅亨網資料<br>
  <span style="font-size:12px;margin-top:6px;display:block;">可能原因：corsproxy 暫時無法使用</span>
  <button class="btn btn-primary" style="margin-top:12px;" onclick="fetchCnyes()">重試</button>
</div>`;
  }
}

function goto(page, el) {
  document.querySelectorAll('.nav-link').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('main').innerHTML = pages[page]();
  window.scrollTo(0,0);
  if (page === 'intraday') loadAllStockNews(currentStrategy==='qj'?MOCK_QJ:MOCK_LZ, currentStrategy);
}

function switchStrategy(s) {
  currentStrategy = s;
  document.getElementById('main').innerHTML = pages.intraday();
  if (s === 'qj') loadAllStockNews(MOCK_QJ);
  if (s === 'lz') loadAllStockNews(MOCK_LZ, 'lz');
}

function filterNews(btn, cat) {
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#news-list .news-card').forEach(card=>{
    card.style.display = (cat==='全部' || card.dataset.cat===cat) ? '' : 'none';
  });
}

// Sort buttons behavior
document.addEventListener('click', e=>{
  if(e.target.classList.contains('sort-btn')) {
    const parent = e.target.closest('.sort-bar');
    if(parent) {
      parent.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
      e.target.classList.add('active');
    }
  }
  if(e.target.classList.contains('filter-btn') && !e.target.closest('.filter-bar[data-news]')) {
    const parent = e.target.closest('.filter-bar');
    if(parent) {
      parent.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      e.target.classList.add('active');
    }
  }
});

goto('intraday');
</script>
