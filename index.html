<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>強勢股龍珠雷達</title>
<link rel="icon" type="image/png" sizes="32x32" href="pixel-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="pixel-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="龍珠雷達">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ══ 暗色主題（預設）══════════════════════════ */
:root, [data-theme="dark"] {
  --bg:       #0f1117;
  --bg2:      #181c27;
  --bg3:      #1e2336;
  --bg4:      #252a3d;
  --border:   #2a3050;
  --border2:  #3a4468;
  --text:     #e8ecf4;
  --text2:    #8892aa;
  --text3:    #4e5a7a;
  --green:    #00c853;
  --green-bg: rgba(0,200,83,0.08);
  --green-bg2:rgba(0,200,83,0.15);
  --red:      #ff4444;
  --red-bg:   rgba(255,68,68,0.08);
  --red-bg2:  rgba(255,68,68,0.15);
  --amber:    #ffb300;
  --amber-bg: rgba(255,179,0,0.10);
  --blue:     #4f8ef7;
  --blue-bg:  rgba(79,142,247,0.10);
  --accent:   #5b8df8;
  --accent-bg:rgba(91,141,248,0.12);
  --purple:   #9c6bf4;
  --purple-bg:rgba(156,107,244,0.10);
  --sidebar-w:180px;
}

/* ══ 亮色主題 ════════════════════════════════ */
[data-theme="light"] {
  --bg:       #f4f5f7;
  --bg2:      #ffffff;
  --bg3:      #f0f2f5;
  --bg4:      #e8ebf0;
  --border:   #e2e5eb;
  --border2:  #c8cdd8;
  --text:     #1a1d24;
  --text2:    #5a6276;
  --text3:    #9aa0b2;
  --green:    #00a651;
  --green-bg: rgba(0,166,81,0.07);
  --green-bg2:rgba(0,166,81,0.13);
  --red:      #d9363e;
  --red-bg:   rgba(217,54,62,0.07);
  --red-bg2:  rgba(217,54,62,0.13);
  --amber:    #c47d00;
  --amber-bg: rgba(196,125,0,0.09);
  --blue:     #1a6fcc;
  --blue-bg:  rgba(26,111,204,0.08);
  --accent:   #2563eb;
  --accent-bg:rgba(37,99,235,0.09);
  --purple:   #7c3aed;
  --purple-bg:rgba(124,58,237,0.08);
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:'Noto Sans TC',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  font-size:15px;
  line-height:1.6;
  transition: background 0.2s, color 0.2s;
}

@keyframes blink   { 0%,100%{opacity:1} 50%{opacity:0.2} }
@keyframes fadeIn  { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes fadeIn2 { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

/* ══ 桌機版 Sidebar ══════════════════════════ */
.sidebar { display:none; }

/* 手機隱藏桌機 header */
.desktop-header { display:none; }

@media (min-width:640px) {
  body { padding-bottom:0; }

  .sidebar {
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0; left:0;
    width:var(--sidebar-w);
    height:100vh;
    background:var(--bg2);
    border-right:1px solid var(--border);
    z-index:100;
    overflow-y:auto;
  }

  .sidebar-logo-area {
    padding:16px 14px 12px;
    border-bottom:1px solid var(--border);
    margin-bottom:8px;
  }

  .sidebar-logo {
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    font-weight:700;
    color:var(--green);
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:10px;
  }

  .sidebar-logo::before {
    content:'';
    width:32px; height:32px;
    background:url('pixel-80.png') center/contain no-repeat;
    flex-shrink:0;
    image-rendering:pixelated;
  }

  .sidebar-theme-btn {
    width:100%;
    padding:6px 10px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--bg3);
    color:var(--text2);
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:all 0.15s;
    font-family:inherit;
  }

  .sidebar-theme-btn:hover { border-color:var(--border2); color:var(--text); }

  .sidebar-section-label {
    padding:8px 14px 4px;
    font-size:12px;
    color:var(--text3);
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:600;
  }

  .sidebar-link {
    display:flex;
    align-items:center;
    gap:10px;
    margin:1px 8px;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    color:var(--text2);
    font-size:14px;
    font-weight:500;
    transition:all 0.15s;
    border:1px solid transparent;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  .sidebar-icon { width:16px; height:16px; flex-shrink:0; }

  .sidebar-link:hover { background:var(--bg3); color:var(--text); }
  .sidebar-link.active { background:var(--green-bg); color:var(--green); border-color:rgba(0,200,83,0.2); }

  [data-theme="light"] .sidebar-link.active { border-color:rgba(0,166,81,0.2); }

  /* k15 + 預估量 + 成交量 同一行 */
  .k15-row {
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .est-vol-chip, .vol-chip {
    font-size:13px;
    color:var(--text2);
    background:var(--bg3);
    border-radius:6px;
    padding:3px 8px;
    white-space:nowrap;
  }
  .est-vol-chip { color:var(--amber); }

  /* k15 chip */
  .k15-chip {
    font-size:12px;
    border-radius:6px;
    padding:3px 8px;
    white-space:nowrap;
  }
  .k15-chip.loading  { background:rgba(255,193,7,0.1);  color:var(--amber); border:1px solid rgba(255,193,7,0.3); }
  .k15-chip.bullish  { background:rgba(0,200,83,0.1);   color:var(--green); border:1px solid rgba(0,200,83,0.3); }
  .k15-chip.bearish  { background:rgba(255,82,82,0.1);  color:var(--red);   border:1px solid rgba(255,82,82,0.3); }

  /* 整體字體放大 */
  .stock-name { font-size:16px; }
  .stock-meta { font-size:14px; }
  .news-item-title { font-size:15px; }

  .sidebar-icon { width:16px; height:16px; flex-shrink:0; }

  /* 頂部滿版 header bar（桌機） */
  .desktop-header {
    display:flex;
    align-items:center;
    position:fixed;
    top:0;
    left:var(--sidebar-w);
    right:0;
    height:48px;
    background:var(--bg2);
    border-bottom:1px solid var(--border);
    padding:0 60px;
    z-index:90;
    gap:12px;
  }

  .desktop-header-title {
    font-size:16px;
    font-weight:700;
    color:var(--text);
  }

  .desktop-header-right {
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    color:var(--text3);
    font-family:'JetBrains Mono',monospace;
  }

  main {
    position:fixed;
    top:48px;
    left:var(--sidebar-w);
    right:0;
    bottom:0;
    overflow-y:auto;
    padding:0 !important;
    margin:0 !important;
    width:auto !important;
    box-sizing:border-box;
  }

  /* 內容全寬 */
  .page-wrap {
    width:100%;
    padding:24px 32px;
    box-sizing:border-box;
  }

  .bottom-nav { display:none !important; }
  .top-bar    { display:none !important; }
}

/* ══ 手機版頂部 + 底部 Tab ═══════════════════ */
.top-bar {
  height:36px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  position:sticky;
  top:0;
  z-index:100;
}

.nav-logo {
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  font-weight:600;
  color:var(--green);
  display:flex;
  align-items:center;
  gap:6px;
}

.wind-gauge {
  font-size:14px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:4px;
  white-space:nowrap;
}
.wind-gauge.red   { color:var(--red); }
.wind-gauge.green { color:var(--green); }

.nav-logo::before {
  content:'';
  width:22px; height:22px;
  background:url('pixel-80.png') center/contain no-repeat;
  flex-shrink:0;
  image-rendering:pixelated;
}

.theme-toggle-btn {
  width:32px; height:32px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg3);
  color:var(--text2);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  transition:all 0.15s;
}

body { padding-bottom:calc(60px + env(safe-area-inset-bottom,0px)); }

.bottom-nav {
  position:fixed;
  bottom:0; left:0; right:0;
  height:calc(60px + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg2);
  border-top:1px solid var(--border);
  display:flex;
  align-items:stretch;
  z-index:200;
}

.nav-link {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  cursor:pointer;
  color:var(--text3);
  border:none;
  background:transparent;
  padding:6px 2px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  transition:color 0.15s;
}

.tab-icon  { font-size:21px; line-height:1; display:flex; align-items:center; justify-content:center; color:inherit; }
.tab-label { font-size:11px; white-space:nowrap; }
.nav-link.active { color:var(--green); }

/* ══ 風度頁 ═══════════════════════════════════ */
.wind-page { padding:4px 2px 16px; }
.wind-head { display:flex; align-items:baseline; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.wind-h1 { font-size:18px; font-weight:700; color:var(--text); }
.wind-sub { font-size:12px; color:var(--text2); }
.wind-top-row { display:flex; gap:10px; margin-bottom:14px; }
.wind-gauge-card { flex:1.1; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:8px; min-width:0; }
.wind-gauge-toplabel { text-align:center; font-size:11px; font-weight:600; color:var(--text2); margin-bottom:2px; }
.wind-gauge-labels { display:flex; justify-content:space-between; font-size:11px; margin-top:-2px; }
.wind-gauge-labels .l { color:var(--green); font-weight:600; }
.wind-gauge-labels .r { color:var(--red); font-weight:600; }
.wind-gauge-now { text-align:center; margin-top:4px; }
.wind-gauge-now .state { font-size:20px; font-weight:800; line-height:1.1; }
.wind-gauge-now .state.red { color:var(--red); }
.wind-gauge-now .state.green { color:var(--green); }
.wind-gauge-now .meta { font-size:10px; color:var(--text3); margin-top:2px; font-family:'JetBrains Mono',monospace; line-height:1.4; }
.wind-desc-box { flex:1; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:6px 10px; display:flex; flex-direction:column; justify-content:center; min-width:0; }
.wind-desc-item { padding:10px 0; border-bottom:1px solid var(--border); }
.wind-desc-item:last-child { border-bottom:none; }
.wind-desc-item .h { display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700; margin-bottom:4px; color:var(--text); white-space:nowrap; }
.wind-desc-item .h .dot { width:5px; height:18px; border-radius:3px; display:inline-block; flex-shrink:0; }
.wind-desc-item .h small { font-size:11px; color:var(--text3); font-weight:500; }
.wind-desc-item .t { font-size:12px; color:var(--text2); line-height:1.6; }
.wind-desc-item .dot.red { background:var(--red); }
.wind-desc-item .dot.white { background:#f0d060; }
.wind-desc-item .dot.green { background:var(--green); }
.wind-tbl-title { font-size:12px; color:var(--text3); margin-bottom:6px; }
.wind-tbl-wrap { overflow-x:auto; }
.wind-tbl { width:100%; border-collapse:collapse; font-size:13px; }
.wind-tbl thead th { background:var(--bg3); color:var(--text2); font-weight:600; padding:7px 4px; border:1px solid var(--border); font-size:12px; text-align:center; }
.wind-tbl tbody td { padding:8px 4px; border:1px solid var(--border); text-align:center; font-family:'JetBrains Mono',monospace; }
.wind-tbl tbody td.date { color:var(--text2); white-space:nowrap; }
.wind-tbl tbody td.wind-c { font-weight:700; font-family:inherit; }
.wind-tbl tbody td.wind-c.red { color:var(--red); }
.wind-tbl tbody td.wind-c.green { color:var(--green); }
.wind-tbl tbody tr:nth-child(even) { background:rgba(255,255,255,0.02); }
.wind-tbl .limit-num { color:var(--red); font-weight:700; }
.wind-tbl .zero { color:var(--text3); }


/* ══ PAGE HEADER ═════════════════════════════ */
.page-header { margin-bottom:16px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.page-title  { font-size:19px; font-weight:700; color:var(--text); white-space:nowrap; }
.page-desc   { font-size:12px; color:var(--text2); }
.page-desc span { color:var(--green); font-family:'JetBrains Mono',monospace; font-size:12px; }

/* ══ STATUS BAR ══════════════════════════════ */
.status-bar {
  display:flex; align-items:center; justify-content:space-between;
  background:var(--bg2); border:1px solid var(--border);
  border-radius:8px; padding:10px 16px; margin-bottom:16px;
  gap:12px; flex-wrap:wrap;
}

.status-info { display:flex; align-items:center; gap:14px; font-size:11px; color:var(--text2); flex-wrap:wrap; }
.status-dot  { display:flex; align-items:center; gap:5px; }
.dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.dot.green { background:var(--green); }
.dot.amber { background:var(--amber); }
.status-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.sort-btn {
  padding:4px 10px; border-radius:6px; font-size:11px; font-weight:500;
  cursor:pointer; border:1px solid var(--border); background:var(--bg3);
  color:var(--text2); transition:all 0.15s; font-family:inherit;
}
.sort-btn:hover { border-color:var(--border2); color:var(--text); }
.sort-btn.active { background:var(--accent-bg); border-color:var(--accent); color:var(--blue); }

/* ══ BUTTONS ══════════════════════════════════ */
.btn {
  padding:6px 14px; border-radius:6px; font-size:11px; font-weight:500;
  cursor:pointer; border:1px solid var(--border2); background:var(--bg3);
  color:var(--text); transition:all 0.15s; font-family:inherit;
}

.btn-primary { background:var(--accent-bg); border-color:var(--accent); color:var(--blue); }

/* ══ BADGES ══════════════════════════════════ */
.badge { padding:2px 7px; border-radius:4px; font-size:12px; font-weight:500; white-space:nowrap; }
.badge-limit  { background:var(--red-bg2);  color:var(--red);   border:1px solid rgba(255,68,68,0.3); }
.badge-up     { background:var(--green-bg2);color:var(--green); border:1px solid rgba(0,200,83,0.3); }
.badge-sector { background:var(--bg4);      color:var(--text2); border:1px solid var(--border2); }
.badge-new    { background:var(--amber-bg); color:var(--amber); border:1px solid rgba(255,179,0,0.3); }
.badge-blue   { background:var(--blue-bg);  color:var(--blue);  border:1px solid rgba(79,142,247,0.3); }

/* ══ STRATEGY TABS ═══════════════════════════ */
.strategy-tabs { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }

.strategy-tab {
  flex:1; min-width:180px;
  background:var(--bg2); border:1.5px solid var(--border);
  border-radius:10px; padding:12px 16px;
  cursor:pointer; transition:all 0.15s; color:var(--text2);
}

.strategy-tab:hover  { border-color:var(--border2); color:var(--text); }
.strategy-tab.active { border-color:var(--accent); background:var(--accent-bg); color:var(--accent); }

/* ══ 盤中警示 v2：表格 + 新聞分割版面 ══════════ */
main:has(.iv2){ padding:0 !important; }
.iv2{ display:flex; flex-direction:column; height:calc(100dvh - 36px - 60px); }
@media (min-width:640px){ .iv2{ height:100%; } .iv2-title, .iv2-clock{ display:none; } }
.iv2-bar{ padding:10px 14px; border-bottom:1px solid var(--border); background:var(--bg2); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
@media (min-width:640px){ .iv2-bar{ padding:12px 20px; } }
.iv2-title{ font-size:15px; font-weight:800; color:var(--text); white-space:nowrap; }
.iv2-seg{ display:inline-flex; background:var(--bg3); border-radius:10px; padding:3px; gap:2px; }
.iv2-seg button{ border:none; background:transparent; color:var(--text2); padding:6px 12px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:700; display:flex; flex-direction:column; line-height:1.15; align-items:flex-start; font-family:inherit; }
.iv2-seg button small{ font-size:10px; font-weight:500; opacity:.7; }
.iv2-seg button.on{ background:var(--green); color:#fff; }
.iv2-seg button.on small{ opacity:.9; }
.iv2-clock{ color:var(--text2); font-size:12px; margin-left:auto; white-space:nowrap; font-family:'JetBrains Mono',monospace; }
.iv2-tools{ padding:8px 14px; border-bottom:1px solid var(--border); background:var(--bg2); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
@media (min-width:640px){ .iv2-tools{ padding:8px 20px; } }
.iv2-stat{ display:flex; align-items:center; gap:14px; font-size:12.5px; color:var(--text2); }
.iv2-stat b{ color:var(--text); font-weight:800; }
.iv2-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle; background:var(--green); }
.iv2-dot.amber{ background:var(--amber); }
.iv2-sorts{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.iv2-sorts .lbl{ color:var(--text3); font-size:12px; }
.iv2-sb{ border:1px solid var(--border); background:var(--bg3); color:var(--text2); border-radius:8px; padding:6px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; }
.iv2-sb.on{ background:var(--accent-bg); border-color:var(--accent); color:var(--blue); font-weight:700; }
.iv2-refresh{ border:1px solid var(--green); color:var(--green); background:transparent; border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }

.iv2-ws{ flex:1; min-height:0; display:flex; }
.iv2-tablewrap{ flex:1; min-height:0; overflow:auto; background:var(--bg2); }
.iv2-table{ width:100%; border-collapse:collapse; table-layout:fixed; }
.iv2-table .c-code{ width:8%; } .iv2-table .c-name{ width:22%; } .iv2-table .c-price{ width:11%; }
.iv2-table .c-chg{ width:14%; } .iv2-table .c-vol{ width:18%; } .iv2-table .c-est{ width:15%; } .iv2-table .c-k15{ width:12%; }
@media (max-width:639px){
  .iv2-table .c-code{ width:13%; } .iv2-table .c-name{ width:21%; } .iv2-table .c-price{ width:13%; }
  .iv2-table .c-chg{ width:17%; } .iv2-table .c-vol{ width:24%; } .iv2-table .c-k15{ width:12%; }
}
.iv2-table thead th{ font-size:12px; color:var(--text3); font-weight:700; text-align:right; padding:10px 8px; border-bottom:1px solid var(--border); background:var(--bg2); position:sticky; top:0; z-index:2; white-space:nowrap; }
@media (min-width:640px){ .iv2-table thead th{ font-size:12.5px; padding:11px 14px; } }
.iv2-table thead th.l{ text-align:left; }
.iv2-table tbody td{ padding:11px 8px; border-bottom:1px solid var(--border); text-align:right; white-space:nowrap; font-size:14.5px; color:var(--text); }
@media (min-width:640px){ .iv2-table tbody td{ padding:13px 14px; font-size:15px; } }
.iv2-table tbody tr{ cursor:pointer; }
.iv2-table tbody tr:hover{ background:var(--bg3); }
.iv2-table tbody tr.sel{ background:var(--accent-bg); }
.iv2-table tbody tr.sel td:first-child{ box-shadow:inset 3px 0 0 var(--green); }
.iv2-code{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#fff; background:var(--green); padding:3px 8px; border-radius:6px; font-weight:700; }
@media (max-width:639px){ .iv2-code{ font-size:12px; padding:2px 6px; } }
.iv2-table td.l{ text-align:left; }
.iv2-nm{ color:var(--text); text-decoration:none; font-weight:700; border-bottom:1.5px dashed var(--text3); padding-bottom:1px; font-size:15px; }
@media (max-width:639px){ .iv2-nm{ font-size:14px; } }
.iv2-nm:hover{ color:var(--green); border-bottom-color:var(--green); }
.iv2-tv{ font-size:10px; color:var(--text3); border:1px solid var(--border); border-radius:5px; padding:1px 5px; margin-left:6px; }
.iv2-mkt{ font-size:10px; color:var(--text2); background:var(--bg3); border-radius:5px; padding:2px 6px; margin-left:5px; }
@media (max-width:639px){ .iv2-tv{ display:none; } .iv2-mkt{ font-size:9px; padding:1px 4px; margin-left:4px; } }
.iv2-num{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
.iv2-chg{ font-weight:800; }
.iv2-chg.up{ color:var(--red); } .iv2-chg.down{ color:var(--green); }
.iv2-table tr.limit{ background:rgba(255,68,68,.08); }
[data-theme="light"] .iv2-table tr.limit{ background:rgba(217,54,62,.07); }
.iv2-table tr.limit td{ border-color:rgba(255,68,68,.25); }
.iv2-chgbox{ display:inline-block; background:var(--red); color:#fff; border-radius:7px; padding:3px 9px; font-weight:800; }
@media (max-width:639px){ .iv2-chgbox,.iv2-chg{ font-size:13.5px; } }
.iv2-k15{ font-size:12px; font-weight:700; border-radius:7px; padding:3px 8px; display:inline-block; }
@media (max-width:639px){ .iv2-k15{ font-size:11px; padding:2px 6px; } }
.iv2-k15.ok{ color:var(--green); background:var(--green-bg); }
.iv2-k15.no{ color:var(--red); background:rgba(255,68,68,.12); }
.iv2-k15.na{ color:var(--text3); background:var(--bg3); }
.iv2-esttag{ font-size:10.5px; font-weight:700; border-radius:5px; padding:1px 5px; margin:0; white-space:nowrap; }
.iv2-esttag.inc{ color:var(--amber); background:rgba(255,179,0,.14); }
.iv2-esttag.dec{ color:var(--text3); background:var(--bg3); }
.iv2-est-inline{ display:none; }
.iv2-vol-m{ display:none; }
@media (max-width:639px){
  .iv2-vol-full{ display:none; }
  .iv2-vol-m{ display:inline; }
}
@media (max-width:639px){
  .iv2-est-col{ display:none; }
  .iv2-est-inline{ display:block; font-size:11px; color:var(--text3); margin-top:3px; }
  .iv2-est-inline .iv2-esttag{ font-size:10.5px; }
}

/* 新聞區：Web 右欄 / 手機下方 */
.iv2-news{ flex:0 0 440px; width:440px; border-left:1px solid var(--border); background:var(--bg2); display:flex; flex-direction:column; min-height:0; }
.iv2-nd-head{ padding:13px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:8px; }
.iv2-nd-head .t{ font-size:15px; font-weight:800; color:var(--text); }
.iv2-nd-head .t small{ font-size:11.5px; color:var(--text2); font-weight:500; margin-left:6px; font-family:'JetBrains Mono',monospace; }
.iv2-nd-meta{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
.iv2-nd-time{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--green); background:var(--green-bg); border-radius:7px; padding:4px 9px; font-weight:700; white-space:nowrap; }
.iv2-nd-time:empty{ display:none; }
.iv2-nd-x{ border:none; background:var(--bg3); color:var(--text2); width:28px; height:28px; border-radius:8px; cursor:pointer; font-size:15px; display:none; }
.iv2-nd-list{ flex:1; min-height:0; overflow:auto; padding:8px 0; }
.iv2-nd-empty{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--text3); font-size:13px; text-align:center; padding:20px; }
@media (max-width:639px){
  .iv2-ws{ flex-direction:column; }
  .iv2-news{ flex:0 0 auto; width:auto; height:0; border-left:none; border-top:1px solid var(--border); overflow:hidden; }
  body.iv2-has-sel .iv2-news{ height:30vh; }
  .iv2-nd-x{ display:block; }
  /* 工具列壓成一排：即時偵測 + 排序同列、字縮小、不換行 */
  .iv2-tools{ flex-wrap:nowrap; gap:6px; padding:6px 12px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .iv2-stat{ font-size:10.5px; gap:8px; flex-shrink:0; }
  .iv2-sorts{ gap:4px; flex-shrink:0; }
  .iv2-sorts .lbl{ display:none; }
  .iv2-sb{ padding:4px 7px; font-size:11px; }
  .iv2-refresh{ padding:4px 7px; font-size:11px; }
}

/* ══ STOCK CARD ══════════════════════════════ */
.stock-list { display:flex; flex-direction:column; gap:10px; }

.stock-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:12px; padding:14px 16px; transition:border-color 0.15s;
}

.stock-card.up     { border-left:3px solid var(--green); }
.stock-card.limit  { border-left:3px solid var(--red); }
.stock-card.strong { border-left:3px solid #f5b800; }
.stock-card.down   { border-left:3px solid var(--green); }
.stock-price.limit-bg { background:var(--red); color:#fff; padding:2px 8px; border-radius:4px; display:inline-block; }

.stock-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px; gap:12px; }
.stock-id  { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

.stock-code   { font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600; color:var(--text); }
.stock-name   { font-size:15px; font-weight:500; color:var(--text); }
.stock-price-area { text-align:right; flex-shrink:0; }
.stock-price  { font-family:'JetBrains Mono',monospace; font-size:21px; font-weight:700; color:var(--red); line-height:1; margin-bottom:2px; }
.stock-price.down { color:var(--green); }
.stock-change.down { color:var(--green); }
.stock-change { font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--red); font-weight:600; }

.stock-meta { display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--text2); margin-bottom:8px; }
.meta-item  { display:flex; align-items:center; gap:4px; }
.meta-val   { color:var(--text); font-family:'JetBrains Mono',monospace; }
.meta-val.amber { color:var(--amber); }
.meta-val.green { color:var(--green); }

/* 條件標籤 */
.cond-tag {
  display:inline-flex; align-items:center; gap:3px;
  padding:2px 7px; border-radius:4px;
  font-size:12px; font-weight:500;
}

/* 15分K 狀態顯示 */
.k15-bar {
  display:flex; align-items:center; gap:8px;
  padding:8px 12px;
  border-radius:8px;
  margin-bottom:10px;
  font-size:13px;
}

.k15-bar.bullish { background:rgba(0,200,83,0.08); border:1px solid rgba(0,200,83,0.2); color:var(--green); }
.k15-bar.loading { background:var(--amber-bg); border:1px solid rgba(255,179,0,0.2); color:var(--amber); }
.k15-bar.none    { background:var(--bg3); border:1px solid var(--border); color:var(--text3); }

/* 預估量 */
.est-vol-bar {
  display:flex; align-items:center; gap:8px;
  padding:6px 12px;
  border-radius:8px;
  background:var(--bg3);
  border:1px solid var(--border);
  margin-bottom:10px;
  font-size:13px;
  color:var(--text2);
}

/* 新聞 snippet */
.news-snippet {
  background:var(--bg3); border:1px solid var(--border);
  border-radius:6px; padding:10px 12px; margin-top:8px;
}

.news-snippet-title { font-size:16px; color:var(--text); margin-bottom:4px; line-height:1.4; }
.news-snippet-meta  { font-size:14px; color:var(--text3); display:flex; gap:8px; }

/* ══ LOADING ══════════════════════════════════ */
.loading-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:10px; padding:40px;
  text-align:center; color:var(--text3); font-size:14px;
}

/* ══ SYNC BAR ═════════════════════════════════ */
.sync-bar {
  background:var(--green-bg); border:1px solid rgba(0,200,83,0.2);
  border-radius:6px; padding:8px 14px; font-size:11px;
  color:var(--green); display:flex; align-items:center;
  gap:8px; margin-bottom:14px; font-family:'JetBrains Mono',monospace;
}

[data-theme="light"] .sync-bar { background:rgba(0,166,81,0.07); border-color:rgba(0,166,81,0.2); }

.pulse-dot { width:7px; height:7px; background:var(--green); border-radius:50%; animation:blink 1.2s infinite; flex-shrink:0; }

/* ══ 台股新聞卡片 ═════════════════════════════ */
.news-list { display:flex; flex-direction:column; gap:8px; }

.news-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:12px; padding:14px 16px;
  cursor:pointer; text-decoration:none; display:block;
  transition:border-color 0.15s, background 0.15s;
}

.news-card:hover { border-color:var(--border2); }
.news-card.read  { background:var(--bg3); }
.news-card.read .news-card-title { color:var(--text3); }

.news-card-title { font-size:16px; font-weight:600; color:var(--text); line-height:1.5; margin-bottom:8px; transition:color 0.2s; }
.news-card-meta  { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text3); flex-wrap:wrap; }
.news-source { color:var(--accent); font-weight:500; }

/* ══ 熱門族群卡片 ═════════════════════════════ */
.sector-news-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:12px; padding:16px;
  cursor:pointer; transition:border-color 0.15s, background 0.15s;
  margin-bottom:8px;
}

.sector-news-card:hover { border-color:var(--border2); }
.sector-news-card.read  { background:var(--bg3); }
.sector-news-card.read .sector-news-card-title { color:var(--text3); }

.sector-news-card-title { font-size:16px; font-weight:700; color:var(--text); line-height:1.5; margin:8px 0 10px; transition:color 0.2s; }

.sector-tag-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px; }

.tag-valid {
  padding:2px 8px; background:var(--amber-bg); color:var(--amber);
  border:1px solid rgba(255,179,0,0.25); border-radius:6px; font-size:12px; font-weight:600;
}

.tag-date {
  padding:2px 8px; background:var(--blue-bg); color:var(--blue);
  border:1px solid rgba(79,142,247,0.25); border-radius:6px; font-size:12px; font-weight:500;
}

/* 相關個股 chips */
.related-stocks {
  display:flex; align-items:center; gap:5px; flex-wrap:wrap;
  margin:8px 0;
  padding:8px 10px;
  background:var(--bg3);
  border-radius:8px;
  border:1px solid var(--border);
}

.related-label {
  font-size:12px; color:var(--text3); flex-shrink:0;
  display:flex; align-items:center; gap:4px;
}

.stock-chip {
  display:inline-flex; align-items:center; gap:3px;
  padding:3px 8px;
  background:var(--accent-bg); color:var(--blue);
  border:1px solid rgba(79,142,247,0.25); border-radius:6px;
  font-size:13px; font-weight:600; font-family:'JetBrains Mono',monospace;
  cursor:pointer; transition:all 0.15s;
}

.stock-chip:hover { background:rgba(79,142,247,0.2); }
.stock-chip.limit { background:var(--red); color:#fff; border-color:var(--red); }
.stock-chip.limit:hover { background:var(--red); opacity:.85; }
.tag-valid.dim { background:var(--bg3); color:var(--text3); border-color:var(--border); }

.sector-meta-row {
  display:flex; align-items:center; gap:8px;
  margin-top:10px; padding-top:10px;
  border-top:1px solid var(--border);
  font-size:13px; color:var(--text3);
}

/* ══ 盤後追蹤 ═════════════════════════════════ */
.after-info-box {
  background:var(--purple-bg); border:1px solid rgba(156,107,244,0.2);
  border-radius:10px; padding:14px 16px; margin-bottom:16px;
  display:flex; gap:10px; font-size:14px; color:var(--text2); line-height:1.6;
}

.after-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:12px; padding:16px; margin-bottom:10px;
  transition:border-color 0.15s; cursor:pointer;
  animation:fadeIn 0.2s ease both;
}

.after-card.limit  { border-left:3px solid var(--red); }
.after-card.up     { border-left:3px solid var(--green); }
.after-card.strong { border-left:3px solid #f5b800; }
.after-card.down   { border-left:3px solid var(--green); }
.after-price.limit-bg { background:var(--red); color:#fff !important; padding:2px 8px; border-radius:4px; display:inline-block; }

.after-card:hover { border-color:var(--border2); }

.after-card-top {
  display:flex; align-items:flex-start;
  justify-content:space-between; margin-bottom:10px; gap:12px;
}

.after-code-area { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.after-code { font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; padding:3px 10px; border-radius:6px; background:var(--accent-bg); color:var(--blue); }
.after-name { font-size:16px; font-weight:600; color:var(--text); }
.after-market { font-size:12px; padding:2px 6px; border-radius:4px; background:var(--bg4); color:var(--text2); border:1px solid var(--border2); }

.after-price-area { text-align:right; flex-shrink:0; }
.after-price  { font-family:'JetBrains Mono',monospace; font-size:23px; font-weight:700; color:var(--text); line-height:1; }
.after-chg    { font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; color:var(--green); }

.after-vol-row {
  display:flex; align-items:center; gap:10px; margin-bottom:10px;
}

.after-vol-num { font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:600; color:var(--text); }

.k15-chip {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; border-radius:6px; font-size:12px; font-weight:500;
}

.k15-chip.bullish { background:rgba(0,200,83,0.1); color:var(--green); border:1px solid rgba(0,200,83,0.25); }
.k15-chip.bearish { background:rgba(255,82,82,0.1); color:var(--red);   border:1px solid rgba(255,82,82,0.25); }
.k15-chip.loading { background:var(--amber-bg); color:var(--amber); border:1px solid rgba(255,179,0,0.25); }

.after-news-hint {
  padding-top:10px; margin-top:4px;
  border-top:1px solid var(--border);
  font-size:13px; color:var(--text3);
}

/* ══ GUIDE ════════════════════════════════════ */
.guide-content { max-width:720px; }
.guide-hero { background:linear-gradient(135deg,var(--bg3) 0%,var(--bg4) 100%); border:1px solid var(--border2); border-radius:12px; padding:24px 28px; margin-bottom:24px; }
.guide-hero-title { font-size:21px; font-weight:700; color:var(--text); margin-bottom:6px; }
.guide-hero-sub   { font-size:14px; color:var(--text2); }
.guide-section { margin-bottom:24px; }
.guide-section-title { font-size:16px; font-weight:700; color:var(--text); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.guide-section-title::before { content:''; width:3px; height:16px; background:var(--green); border-radius:2px; }
.sop-steps { display:flex; flex-direction:column; gap:10px; }
.sop-step  { display:flex; gap:14px; background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:14px 16px; }
.step-num  { width:28px; height:28px; border-radius:50%; background:var(--accent-bg); border:1px solid var(--accent); color:var(--blue); font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-family:'JetBrains Mono',monospace; }
.step-title { font-size:14px; font-weight:700; color:var(--text); margin-bottom:4px; }
.step-desc  { font-size:14px; color:var(--text2); line-height:1.6; }
.exit-grid  { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.exit-card  { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:14px 16px; border-top:2px solid var(--red); }
.exit-card-title { font-size:14px; font-weight:700; color:var(--red); margin-bottom:6px; }
.exit-card-desc  { font-size:13px; color:var(--text2); line-height:1.6; }

/* ══ SCROLLBAR ════════════════════════════════ */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
</style>
</head>

<script>
const WORKER = 'https://stockradar-worker.lucastockradar.workers.dev';
const NEWS_API = 'https://stockradar-news.onrender.com';

// ── 主題切換 ───────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeUI(next);
}

function updateThemeUI(theme) {
  const isDark = theme === 'dark';
  const icon  = document.getElementById('theme-icon');
  const label = document.getElementById('theme-label');
  const mBtn  = document.getElementById('mobile-theme-btn');
  if (icon)  icon.textContent  = isDark ? '☀️' : '🌙';
  if (label) label.textContent = isDark ? '切換亮色' : '切換暗色';
  if (mBtn)  mBtn.textContent  = isDark ? '☀️' : '🌙';
}

// 初始化主題
(function() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeUI(saved);
})();

// ── 已讀記錄 ───────────────────────────────────
function markRead(url) {
  const read = JSON.parse(localStorage.getItem('read_urls') || '{}');
  read[url] = Date.now();
  localStorage.setItem('read_urls', JSON.stringify(read));
}

function isRead(url) {
  const read = JSON.parse(localStorage.getItem('read_urls') || '{}');
  if (!read[url]) return false;
  if (Date.now() - read[url] > 7 * 24 * 60 * 60 * 1000) return false;
  return true;
}

// ── 桌機時鐘 ───────────────────────────────────
function startClock() {
  const el = document.getElementById('desktop-clock');
  if (!el) return;
  function tick() {
    el.textContent = new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }
  tick();
  setInterval(tick, 1000);
}

// ── 從標題抓相關個股代號 ───────────────────────
function extractStockCodes(title) {
  // 從標題抓「名稱(1234)」或只抓「(1234)」。
  const re = /([\u4e00-\u9fffA-Za-z0-9\-＊*]{0,12})[（(](\d{4})[）)]/g;
  const stocks = [];
  const seen = new Set();
  let m;
  while ((m = re.exec(title || '')) !== null) {
    const name = (m[1] || '').replace(/[，。、；:：\s]/g, '').slice(-8);
    const code = m[2];
    if (!seen.has(code)) {
      seen.add(code);
      stocks.push(name ? { name, code } : code);
    }
  }
  return stocks;
}

function normalizeRelatedStocks(stocks) {
  const seen = new Set();
  return (stocks || []).map(s => {
    if (typeof s === 'string') return { code: s, name: '' };
    return { code: String(s.code || ''), name: String(s.name || '') };
  }).filter(s => /^\d{4}$/.test(s.code) && !seen.has(s.code) && seen.add(s.code));
}

// 渲染相關個股 chips：對到120檔配股名、沒對到顯示股號；漲停(在警示榜)標紅
// 回傳 { html, hasLimit }：hasLimit 供外層「有效題材」標籤判斷亮/暗
function renderRelatedStocks(stocks) {
  const list = normalizeRelatedStocks(stocks);   // 全部顯示：對到配股名，沒對到顯示股號
  if (!list.length) return { html: '', hasLimit: false };
  let hasLimit = false;
  const chips = list.map(s => {
    const name = stockNameMap[s.code] || '';
    // 漲停判斷：查警示榜(漲停的股漲幅≥7%必在起漲K榜)。在榜且 limit 或漲幅≥9.5 → 漲停
    const a = limitMap[s.code];
    const isLimit = !!a;
    if (isLimit) hasLimit = true;
    const label = name ? `${name}(${s.code})` : s.code;
    return `<span class="stock-chip${isLimit?' limit':''}" onclick="event.stopPropagation();window.open('https://tw.tradingview.com/chart/?symbol=TWSE:${s.code}','_blank')">${label}${isLimit?' 🔴':''}</span>`;
  }).join('');
  return {
    html: `\n<div class="related-stocks">\n  <span class="related-label">🎯 指標主流股：</span>\n  ${chips}\n</div>`,
    hasLimit,
  };
}

// ── 全域資料 ───────────────────────────────────
let alertsData    = { qj: [], lz: [] };
let currentStrategy = 'qj';
let currentSort = 'chg';
let stockNameMap  = {};   // 120檔 code → name（族群配股名用）
let limitMap      = {};   // code → true（漲停股，族群亮燈用，來自警示榜）

// 抓 120 檔對照表 + 警示榜漲停股（族群頁用，失敗不影響其他功能）
async function loadSectorStockData() {
  try {
    const [slRes, alRes] = await Promise.all([
      fetch(`${WORKER}/api/stocklist`),
      fetch(`${WORKER}/api/alerts`),
    ]);
    const sl = await slRes.json();
    if (Array.isArray(sl)) {
      stockNameMap = {};
      sl.forEach(s => { if (s.code) stockNameMap[s.code] = s.name || ''; });
    }
    // 從警示榜建漲停表：limit 為 true，或漲幅 ≥ 9.5 視為漲停
    const al = await alRes.json();
    limitMap = {};
    if (Array.isArray(al)) {
      al.forEach(a => {
        if (a.code && (a.limit === true || (+a.chg) >= 9.5)) limitMap[a.code] = true;
      });
    }
  } catch (e) {
    console.log('loadSectorStockData fail:', e.message);
  }
}

// ── 市場風度圖：讀 Worker 算好的狀態，顯示在頂部 ──
let windGaugeData = null;
async function loadWindGauge() {
  try {
    const res = await fetch(`${WORKER}/api/wind-gauge`);
    const wg  = await res.json();
    const el  = document.getElementById('wind-gauge');
    if (!el) return;
    if (!wg || !wg.label) { el.style.display = 'none'; return; }
    windGaugeData = wg;
    el.className = `wind-gauge ${wg.color}`;
    el.textContent = `行情：${wg.label}`;
    el.style.display = 'flex';
  } catch (e) {
    console.log('loadWindGauge fail:', e.message);
  }
}
function showWindGaugeInfo() {
  if (!windGaugeData) return;
  const w = windGaugeData;
  const cond1 = w.aboveMA ? '櫃買指數 ≥ 20MA' : '櫃買指數 < 20MA';
  const cond2 = w.histUp ? '當日MACD柱 > 前一日' : '當日MACD柱 < 前一日';
  const desc = {
    '強風':'勝率偏高的行情','亂流':'行情震盪，嚴守紀律',
    '陣風':'開始起風，嘗試交易','無風':'勝率很低，多做多賠！'
  }[w.label] || '';
  alert(`市場風度圖：${w.label}\n${desc}\n\n${cond1}\n${cond2}\n\n櫃買指數 ${w.close}（20MA ${w.ma20}）`);
}

// ── 風度頁：讀 env-history,渲染儀表板 + 歷史表格 ──
function windDrawGauge(dev, color, label) {
  // 畫分段色塊半圓(11段,左綠中白右紅)
  const layer = document.getElementById('wind-seg-layer');
  if (!layer) return;
  layer.innerHTML = '';
  const cx=110, cy=118, r=85, NSEG=11, gap=7, span=180/NSEG;
  const colors=['#2ecc71','#52d98a','#7ee0a5','#b8e6c8','#e8c477','#f0d060','#e8c477','#f0b5b6','#f08a8c','#f06163','#e74c3c'];
  const pol = (a)=>{ const rad=a*Math.PI/180; return [cx+r*Math.cos(rad), cy-r*Math.sin(rad)]; };
  for (let i=0;i<NSEG;i++){
    const a0=180 - i*span - gap/2, a1=180 - (i+1)*span + gap/2;
    const [x0,y0]=pol(a0), [x1,y1]=pol(a1);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`);
    p.setAttribute('stroke',colors[i]);
    layer.appendChild(p);
  }
  // 指針:偏離率 dev,±6%滿格
  const clamp=Math.max(-6,Math.min(6, dev||0));
  const ang=90 - (clamp/6)*90;           // dev+6→0°(右), -6→180°(左), 0→90°(上)
  const needle=document.getElementById('wind-needle');
  if (needle) needle.setAttribute('transform',`rotate(${(90-ang).toFixed(1)} ${cx} ${cy})`);
}

async function loadWindPage() {
  try {
    const res = await fetch(`${WORKER}/api/env-history`);
    const hist = await res.json();
    const list = Array.isArray(hist) ? hist : [];
    // 最新一筆(陣列尾端)當今日儀表板
    const latest = list.length ? list[list.length-1] : null;

    // 儀表板
    const stateEl = document.getElementById('wind-state');
    const metaEl  = document.getElementById('wind-meta');
    if (latest && latest.wind) {
      windDrawGauge(latest.dev, latest.color, latest.wind);
      if (stateEl) { stateEl.textContent = latest.wind; stateEl.className = `state ${latest.color||''}`; }
      if (metaEl) metaEl.innerHTML = `櫃買 ${latest.close??'—'}｜20MA ${latest.ma20??'—'}<br>偏離 ${latest.dev>=0?'+':''}${latest.dev??'—'}%｜MACD柱 ${latest.histUp?'↑':'↓'}`;
    } else {
      windDrawGauge(0, null, null);
      if (stateEl) { stateEl.textContent = '—'; stateEl.className = 'state'; }
      if (metaEl) metaEl.textContent = '尚無風度資料（收盤後更新）';
    }

    // 歷史表格(新到舊)
    const tbody = document.getElementById('wind-tbody');
    if (tbody) {
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text3);">尚無記錄</td></tr>';
      } else {
        const rows = [...list].reverse().map(e => {
          const d = e.date ? e.date.slice(5).replace('-','/') : '—';
          const windCls = e.color || '';
          const windTxt = e.wind || '—';
          const num = (v, limit) => (v===0||v==null) ? `<span class="zero">0</span>` : (limit ? `<span class="limit-num">${v}</span>` : v);
          return `<tr>
            <td class="date">${d}</td>
            <td class="wind-c ${windCls}">${windTxt}</td>
            <td>${e.qjCount??0}</td><td>${num(e.qjLimit,true)}</td>
            <td>${e.lzCount??0}</td><td>${num(e.lzLimit,true)}</td>
          </tr>`;
        }).join('');
        tbody.innerHTML = rows;
      }
    }
  } catch (e) {
    console.log('loadWindPage fail:', e.message);
    const tbody = document.getElementById('wind-tbody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text3);">載入失敗</td></tr>';
  }
}

// ── 輔助 ───────────────────────────────────────
function fmtChg(v) { return (v>0?'+':'')+v.toFixed(2)+'%'; }

function k15Status(s) {
  const now = new Date();
  const twHour = (now.getUTCHours() + 8) % 24;
  const twMin  = now.getUTCMinutes();
  const totalMin = twHour * 60 + twMin;
  const t915  = 9 * 60 + 15;
  const t1330 = 13 * 60 + 30;

  // 盤後：有k15資料就顯示結果，沒有就不顯示
  if (totalMin > t1330) {
    if (s.k15 === true)  return `<span class="k15-chip bullish">15分K ✅符合</span>`;
    if (s.k15 === false) return `<span class="k15-chip bearish">15分K ❌不符合</span>`;
    return '';
  }

  // 09:00-09:15 核對中
  if (totalMin < t915) {
    return `<span class="k15-chip loading">⏱ 15分K 核對中</span>`;
  }

  // 09:15後判斷
  if (s.k15 === true)  return `<span class="k15-chip bullish">15分K ✅符合</span>`;
  if (s.k15 === false) return `<span class="k15-chip bearish">15分K ❌不符合</span>`;

  // 預設核對中（還沒有k15資料）
  return `<span class="k15-chip loading">⏱ 15分K 核對中</span>`;
}

function estVolBar(s) {
  if (!s.estVol) return '';
  return `
<div class="est-vol-bar">
  <span>📊 預估全日量</span>
  <span style="color:var(--amber);font-family:'JetBrains Mono',monospace;font-weight:600;">${s.estVol.toLocaleString()} 千張</span>
  <span style="color:var(--text3);margin-left:auto;">剩 ${s.leftMin||0} 分鐘收盤</span>
</div>`;
}

// ── 策略一 card（起漲K）───────────────────────
function cardQJ(s, idx) {
  const newsId  = `news-qj-${s.code}`;
  const twTime  = s.ts ? new Date(s.ts).toLocaleTimeString('zh-TW', {

  }) : (s.time || '');
  const volFull = s.vol ? s.vol.toLocaleString() : '-';

  return `
<div class="stock-card ${s.limit?'limit':'strong'}" style="animation:fadeIn 0.2s ease ${idx*0.04}s both">
  <div class="stock-top">
    <div class="stock-id">
      <span class="stock-code" onclick="event.stopPropagation();window.open('https://tw.tradingview.com/chart/?symbol=TWSE:${s.code}','_blank')" style="cursor:pointer;">${s.code}</span>
      <span class="stock-name" onclick="event.stopPropagation();window.open('https://tw.tradingview.com/chart/?symbol=TWSE:${s.code}','_blank')" style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;">${s.name}</span>
      ${s.limit?'<span class="badge badge-limit">漲停</span>':'<span class="badge badge-up">強漲</span>'}
      ${s.market?`<span class="badge badge-sector">${s.market}</span>`:''}
    </div>
    <div class="stock-price-area">
      <div class="stock-price${(+(s.chg||0))>=9.5?' limit-bg':((+(s.chg||0))<0?' down':'')}">${(+(s.price||0)).toFixed(1)}</div>
      <div class="stock-change${(+(s.chg||0))<0?' down':''}">${fmtChg(+(s.chg||0))}</div>
    </div>
  </div>

  <div class="k15-row">
    ${k15Status(s)}
    <span class="est-vol-chip">📊 預估量 ${estVolStr}</span>
    <span class="vol-chip">成交 ${volFull}張</span>
    <span class="vol-chip">成交值 ${s.tradeValue?(s.tradeValue/100000000).toFixed(2)+'億':'-'}</span>
  </div>

  <div class="stock-meta">
    <div class="meta-item">⏱ 入榜 <span class="meta-val">${twTime}</span></div>

  <div id="${newsId}" style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px;">
    <div style="font-size:11px;color:var(--text3);">📰 載入個股新聞中...</div>
  </div>
</div>`;
}

// ── 策略二 card（量增K）───────────────────────
function cardLZ(s, idx) {

  return `
<div class="stock-card ${(+(s.chg||0))>=9.5?'limit':((+(s.chg||0))>=0?'strong':'down')}" style="animation:fadeIn 0.2s ease ${idx*0.04}s both">
  <div class="stock-top">
    <div class="stock-id">
      <span class="stock-code" onclick="event.stopPropagation();window.open('https://tw.tradingview.com/chart/?symbol=TWSE:${s.code}','_blank')" style="cursor:pointer;">${s.code}</span>
      <span class="stock-name" onclick="event.stopPropagation();window.open('https://tw.tradingview.com/chart/?symbol=TWSE:${s.code}','_blank')" style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;">${s.name}</span>
      <span class="badge badge-limit">前日漲停</span>
      ${s.market?`<span class="badge badge-sector">${s.market}</span>`:''}
    </div>
    <div class="stock-price-area">
      <div class="stock-price${(+(s.chg||0))>=9.5?' limit-bg':((+(s.chg||0))<0?' down':'')}">${(+(s.price||0)).toFixed(1)}</div>
      <div class="stock-change${(+(s.chg||0))<0?' down':''}">${fmtChg(+(s.chg||0))}</div>
    </div>
  </div>

  <div class="k15-row">

  </div>

  <div class="stock-meta">
    <div class="meta-item">⏱ 入榜 <span class="meta-val">${twTime}</span></div>
    <div class="meta-item">昨日量 <span class="meta-val">${prevVolStr}</span></div>
  </div>

  <div id="${newsId}" style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px;">
    <div style="font-size:11px;color:var(--text3);">📰 載入個股新聞中...</div>
  </div>
</div>`;
}

// ── 盤後追蹤 card ──────────────────────────────
function cardAfter(s, idx) {

  const tvDisplay  = s.tradeValue ? (s.tradeValue / 100000000).toFixed(2) + ' 億' : '-';

      <div class="after-chg" style="color:${(+(s.chg||0))>=0?'var(--red)':'var(--green)'}">${(+(s.chg||0))>=0?'↗':'↘'} ${fmtChg(+(s.chg||0))}</div>

// ── 盤中 API ───────────────────────────────────
async function fetchAlerts() {
  loadWindGauge();   // 順便更新頂部風度圖（不阻塞）
  const listEl = document.getElementById('strategy-list');
  const timeEl = document.getElementById('alerts-time');
  if (!listEl) return;
  try {
    const res  = await fetch(`${WORKER}/api/alerts`);
    const data = await res.json();
    const all  = Array.isArray(data) ? data : [];
    alertsData.qj = all.filter(a => !a.strategy || a.strategy === 'qj');
    alertsData.lz = all.filter(a => a.strategy === 'lz');
    const now = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if (timeEl) timeEl.textContent = now;
    renderAlertsList();
  } catch(err) {
    if (listEl) listEl.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px 16px;color:var(--text3);">⚠️ ${err.message}<br><button class="iv2-refresh" style="margin-top:12px;" onclick="fetchAlerts()">重試</button></td></tr>`;
  }
}

function setSort(type) {
  currentSort = type;
  document.querySelectorAll('.iv2-sb').forEach(b => b.classList.remove('on'));
  const btn = document.getElementById('sort-' + type);
  if (btn) btn.classList.add('on');
  renderAlertsList();
}

function sortStocks(stocks) {
  const arr = [...stocks];
  if (currentSort === 'chg') return arr.sort((a,b) => (+(b.chg||0)) - (+(a.chg||0)));
  if (currentSort === 'vol') return arr.sort((a,b) => (+(b.vol||0)) - (+(a.vol||0)));
  // 入榜時間：最新在上
  return arr.sort((a,b) => (b.ts||0) - (a.ts||0));
}

// ── 市場別 TradingView 代碼（上市 TWSE / 上櫃 TPEX）──
function ivTvSym(s){ return (s.market==='OTC'?'TPEX:':'TWSE:') + s.code; }
function ivTvUrl(s){ return 'https://tw.tradingview.com/chart/?symbol=' + encodeURIComponent(ivTvSym(s)); }
function ivFmtVol(v){ return (v||0).toLocaleString('en-US'); }
function ivFmtVolM(v){ return v>=10000 ? (v/10000).toFixed(1).replace(/\.0$/,'')+'萬' : (v||0).toLocaleString('en-US'); }
function ivTwTime(s){
  if (s.ts) return new Date(s.ts).toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false});
  return s.time || '';
}
function iv15(s){
  if (s.k15 === true)  return '<span class="iv2-k15 ok">✓符合</span>';
  if (s.k15 === false) return '<span class="iv2-k15 no">✗不符</span>';
  return '<span class="iv2-k15 na">—</span>';
}
function ivRow(s){
  const chg = +(s.chg||0);
  const lim = chg >= 9.5;
  const dir = chg >= 0 ? 'up' : 'down';
  const sign = chg >= 0 ? '+' : '';
  const chgCell = lim
    ? `<span class="iv2-chgbox iv2-num">${sign}${chg.toFixed(2)}%</span>`
    : `<span class="iv2-chg iv2-num ${dir}">${sign}${chg.toFixed(2)}%</span>`;
  const hasEst = s.estVol && s.prevVol;
  const inc = hasEst && s.estVol > s.prevVol;
  const tag  = hasEst ? `<span class="iv2-esttag ${inc?'inc':'dec'}">${inc?'▲量增':'▼量縮'}</span>` : '';
  const tagS = hasEst ? `<span class="iv2-esttag ${inc?'inc':'dec'}">${inc?'▲增':'▼縮'}</span>` : '';
  const estMain = s.estVol ? `${tag} ${ivFmtVol(s.estVol)}張` : '<span style="color:var(--text3)">—</span>';
  const estInline = s.estVol ? `<span class="iv2-est-inline">${tagS} 估${ivFmtVolM(s.estVol)}張</span>` : '';
  return `<tr class="${lim?'limit':''} ${s.code===ivSelCode?'sel':''}" data-code="${s.code}" onclick="openNews('${s.code}')">
    <td class="l"><span class="iv2-code">${s.code}</span></td>
    <td class="l"><a class="iv2-nm" href="${ivTvUrl(s)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${s.name}</a><span class="iv2-tv">TV</span>${s.market?`<span class="iv2-mkt">${s.market}</span>`:''}</td>
    <td class="iv2-num">${(+(s.price||0)).toFixed(1)}</td>
    <td>${chgCell}</td>
    <td class="iv2-num"><span class="iv2-vol-full">${ivFmtVol(s.vol)}張</span><span class="iv2-vol-m">${ivFmtVolM(s.vol)}張</span>${estInline}</td>
    <td class="iv2-num iv2-est-col">${estMain}</td>
    <td>${iv15(s)}</td>
  </tr>`;
}

function renderAlertsList() {
  const listEl  = document.getElementById('strategy-list');
  const countEl = document.getElementById('alerts-count');
  const limitEl = document.getElementById('alerts-limit');
  if (!listEl) return;
  const isQJ   = currentStrategy === 'qj';
  const stocks = sortStocks(isQJ ? alertsData.qj : alertsData.lz);
  if (countEl) countEl.textContent = stocks.length;
  if (limitEl) limitEl.textContent = `漲停 ${stocks.filter(s=>(+(s.chg||0))>=9.5).length}`;
  if (!stocks.length) {
    listEl.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px 16px;color:var(--text3);">目前無符合條件的強勢股，盤中每分鐘自動更新</td></tr>';
    return;
  }
  ivAlertIndex = {};
  stocks.forEach(s => { ivAlertIndex[s.code] = s; });
  listEl.innerHTML = stocks.map(s => ivRow(s)).join('');
  // 若已選取的股票還在清單裡，保持選取並刷新它的新聞；否則收起
  if (ivSelCode && ivAlertIndex[ivSelCode]) openNews(ivSelCode, true);
}

// ── 個股新聞副卡 ───────────────────────────────
let ivSelCode = null;
let ivAlertIndex = {};
function openNews(code, keepScroll){
  const s = ivAlertIndex[code]; if (!s) return;
  ivSelCode = code;
  document.body.classList.add('iv2-has-sel');
  document.querySelectorAll('#strategy-list tr').forEach(tr => tr.classList.toggle('sel', tr.dataset.code===code));
  const titleEl = document.getElementById('iv2-nd-title');
  const timeEl  = document.getElementById('iv2-nd-time');
  const emptyEl = document.getElementById('iv2-nd-empty');
  const listEl  = document.getElementById('iv2-nd-list');
  if (titleEl) titleEl.innerHTML = `${s.name}<small>${s.code} · ${s.market==='OTC'?'上櫃':'上市'}</small>`;
  if (timeEl)  timeEl.textContent = `入榜 ${ivTwTime(s)}`;
  if (emptyEl) emptyEl.style.display = 'none';
  if (listEl)  { listEl.style.display = 'block'; if(!keepScroll) listEl.scrollTop = 0; }
  fetchDockNews(s.code, s.name);
  // 手機：把選取的列捲到新聞區上方看得見
  if (!keepScroll && window.matchMedia('(max-width:639px)').matches){
    const tr = [...document.querySelectorAll('#strategy-list tr')].find(t=>t.dataset.code===code);
    setTimeout(()=>tr&&tr.scrollIntoView({behavior:'smooth',block:'nearest'}),80);
  }
}
function clearSel(){
  ivSelCode = null;
  document.body.classList.remove('iv2-has-sel');
  document.querySelectorAll('#strategy-list tr').forEach(tr => tr.classList.remove('sel'));
  const emptyEl = document.getElementById('iv2-nd-empty');
  const listEl  = document.getElementById('iv2-nd-list');
  const titleEl = document.getElementById('iv2-nd-title');
  const timeEl  = document.getElementById('iv2-nd-time');
  if (listEl)  listEl.style.display = 'none';
  if (emptyEl) emptyEl.style.display = 'flex';
  if (titleEl) titleEl.textContent = '相關新聞';
  if (timeEl)  timeEl.textContent = '';
}
async function fetchDockNews(code, name){
  const el = document.getElementById('iv2-nd-list'); if (!el) return;
  const keyword = String(name || code || '').trim();
  const cacheKey = `${code}-${keyword}`;
  if (newsCache[cacheKey]) { renderDockNews(el, newsCache[cacheKey]); return; }
  el.innerHTML = '<div style="padding:16px;font-size:12px;color:var(--text3);">📰 載入新聞中…</div>';
  try{
    const res  = await fetch(`${NEWS_API}/api/stock-news?name=${encodeURIComponent(keyword)}&code=${encodeURIComponent(code)}`);
    const rows = await res.json();
    const filtered = normalizeRenderStockNews(rows, code, keyword);
    newsCache[cacheKey] = filtered;
    renderDockNews(el, filtered);
  }catch{
    el.innerHTML = '<div style="padding:16px;font-size:12px;color:var(--text3);">⚠️ 新聞載入失敗</div>';
  }
}
function renderDockNews(el, items){
  if (!items || !items.length){ el.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--text3);">目前無相關新聞</div>'; return; }
  el.innerHTML = items.slice(0,10).map(n=>{
    const d = new Date(n.pub);
    const t = isNaN(d) ? '' : d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<a href="${n.link}" target="_blank" rel="noopener" style="display:block;padding:11px 16px;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text);">
      <div style="font-size:13.5px;line-height:1.45;">${n.title}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:5px;display:flex;gap:8px;"><span style="color:var(--accent);">${n.src||''}</span><span>${t}</span></div></a>`;
  }).join('');
}

async function fetchAfterHours() {
  const listEl  = document.getElementById('after-list');
  const timeEl  = document.getElementById('after-time');
  if (!listEl) return;
  try {
    const res  = await fetch(`${WORKER}/api/afterhours`);
    const data = await res.json();
    const now  = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    if (timeEl) timeEl.textContent = now;
    if (!data.length) {
      listEl.innerHTML = '<div class="loading-card">今日盤後資料尚未產生<br><span style="font-size:12px;color:var(--text3);display:block;margin-top:8px;">收盤後 17:00 自動更新</span></div>';
      return;
    }
    data.sort((a,b)=>(b.tradeValue||0)-(a.tradeValue||0));
    listEl.innerHTML = data.map((s,i)=>cardAfter(s,i)).join('');
    loadAllStockNews(data, 'after');
  } catch(err) {
    if (listEl) listEl.innerHTML = `<div class="loading-card">⚠️ ${err.message}<br><button class="btn btn-primary" style="margin-top:12px;" onclick="fetchAfterHours()">重試</button></div>`;
  }
}

// ── Google News 個股新聞 ────────────────────────
const newsCache = {};
const NEWS_MEDIA = ['工商時報','鉅亨網','Yahoo','經濟日報','中國時報','時報資訊','旺德富','旺得富','富聯網','時報'];

function googleNewsSearchUrl(keyword) {
  return `https://news.google.com/search?q=${encodeURIComponent(keyword)}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
}

function cleanGoogleNewsTitle(title) {
  return String(title || '').replace(/ - Google 新聞$/, '').replace(/ - Google News$/, '').trim();
}

function parseRSSItems(raw, fallbackKeyword, fallbackTime) {
  const items = [];
  if (!raw || typeof raw !== 'string') return items;

  try {
    const parser = new DOMParser();
    const xml = parser.parseFromString(raw, 'text/xml');
    const nodes = Array.from(xml.querySelectorAll('item'));
    for (const item of nodes) {
      const title = cleanGoogleNewsTitle(item.querySelector('title')?.textContent || fallbackKeyword || '新聞');
      const link  = item.querySelector('link')?.textContent || googleNewsSearchUrl(fallbackKeyword || title);
      const pub   = item.querySelector('pubDate')?.textContent || fallbackTime || '';
      const src   = item.querySelector('source')?.textContent || 'Google RSS';
      if (title) items.push({ title, link, pub, src });
    }
  } catch(e) {}

  // 目前 Render 後端若只回傳 RSS 前 500 字，可能還沒有 <item>。
  // 這時至少顯示「此股新聞已更新」並連到 Google News 搜尋。
  if (!items.length && fallbackKeyword) {
    items.push({
      title: `${fallbackKeyword} 最新新聞已更新`,
      link: googleNewsSearchUrl(fallbackKeyword),
      pub: fallbackTime || '',
      src: 'Google RSS'
    });
  }
  return items;
}

function normalizeRenderStockNews(rows, code, name) {
  const list = Array.isArray(rows) ? rows : [];
  const out = [];

  for (const r of list) {
    if (Array.isArray(r.items)) {
      for (const n of r.items) {
        out.push({
          title: n.title || '',
          link: n.link || n.url || '',
          pub: n.pub || r.time || '',
          src: n.src || 'Google RSS'
        });
      }
    }
  }

  return out.filter(n => n.title && n.link).slice(0, 10);
}

async function fetchStockNews(code, name, prefix='qj') {
  const el = document.getElementById(`news-${prefix}-${code}`);
  if (!el) return;

  const keyword = String(name || code || '').trim();
  const cacheKey = `${code}-${keyword}`;
  if (newsCache[cacheKey]) {
    renderStockNews(el, newsCache[cacheKey]);
    return;
  }

  try {
    const res = await fetch(`${NEWS_API}/api/stock-news?name=${encodeURIComponent(keyword)}&code=${encodeURIComponent(code)}`);
    const rows = await res.json();
    const filtered = normalizeRenderStockNews(rows, code, keyword);
    newsCache[cacheKey] = filtered;
    renderStockNews(el, filtered);
  } catch {
    el.innerHTML = '<div style="font-size:11px;color:var(--text3);">⚠️ 新聞載入失敗</div>';
  }
}

function renderStockNews(el, items) {
  if (!items.length) { el.innerHTML = '<div style="font-size:11px;color:var(--text3);">目前無相關新聞</div>'; return; }
  const PREVIEW = 2;
  const renderItem = (n, hidden) => {
    const d = new Date(n.pub);
    const t = isNaN(d) ? '' : d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const display = hidden ? 'none' : 'block';
    const cls = hidden ? ' news-extra' : '';
    return '<a href="' + n.link + '" target="_blank" rel="noopener" class="news-item' + cls + '" style="text-decoration:none;display:' + display + ';margin-bottom:6px;"><div style="padding:8px 10px;background:var(--bg3);border-radius:6px;border:1px solid var(--border);"><div style="font-size:12px;color:var(--text);line-height:1.4;margin-bottom:3px;">' + n.title + '</div><div style="font-size:11px;color:var(--text3);display:flex;gap:8px;"><span style=\'color:var(--accent);\'>' + n.src + '</span><span>' + t + '</span></div></div></a>';
  };
  const allHtml = items.map((n, i) => renderItem(n, i >= PREVIEW)).join('');
  if (items.length <= PREVIEW) { el.innerHTML = allHtml; return; }
  const toggleId = 'toggle-' + Math.random().toString(36).slice(2,8);
  el.innerHTML = allHtml + '<div id="' + toggleId + '" style="text-align:center;padding:6px;cursor:pointer;font-size:12px;color:var(--text3);border:1px dashed var(--border);border-radius:6px;margin-top:4px;">還有 ' + (items.length - PREVIEW) + ' 則新聞 ▼ 點擊展開</div>';
  let expanded = false;
  document.getElementById(toggleId).addEventListener('click', function() {
    expanded = !expanded;
    el.querySelectorAll('.news-extra').forEach(function(a, idx) { a.style.display = (expanded && idx < 6) ? 'block' : 'none'; });
    this.textContent = expanded ? '▲ 收起，只顯示 2 則' : ('還有 ' + (items.length - PREVIEW) + ' 則新聞 ▼ 點擊展開');
  });
}
function loadAllStockNews(stocks, prefix='qj') {
  stocks.forEach((s,i) => setTimeout(()=>fetchStockNews(s.code,s.name,prefix), i*400));
}

function normalizeRenderSectorNews(rows) {
  const list = Array.isArray(rows) ? rows : [];
  const out = [];

  for (const r of list) {
    if (Array.isArray(r.items)) {
      for (const n of r.items) {
        out.push({
          title: n.title || '',
          url: n.link || n.url || '',
          time: n.pub || r.time || '',
          src: n.src || 'Google RSS',
          cat: '熱門族群'
        });
      }
    }
  }

  return out.filter(n => n.title && n.url)
    .sort((a, b) => new Date(b.time) - new Date(a.time))
    .slice(0, 100);
}

function goto(page, el) {
  document.querySelectorAll('.sidebar-link').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.bottom-nav .nav-link').forEach(n=>n.classList.remove('active'));
  if (el) {
    el.classList.add('active');
  } else {
    // 啟動或程式呼叫時沒帶 el：依 page 自動找對應導航標記 active
    document.querySelectorAll(`[onclick*="goto('${page}'"]`).forEach(n=>n.classList.add('active'));
  }

  // 更新桌機頂部標題
  const titleEl = document.getElementById('desktop-page-title');
  if (titleEl) titleEl.textContent = PAGE_TITLES[page]||'';

  document.getElementById('main').innerHTML = pages[page]();
  window.scrollTo(0,0);

  // 記住最後一頁
  try { localStorage.setItem('lastPage', page); } catch(e) {}
}

function switchStrategy(s) {
  currentStrategy = s;
  document.querySelectorAll('.iv2-seg button').forEach((b,i)=> b.classList.toggle('on', s==='qj' ? i===0 : i===1));
  clearSel();
  renderAlertsList();
}

startClock();
loadWindGauge();                          // 頁面一載入就顯示風度圖
setInterval(loadWindGauge, 5 * 60 * 1000); // 每5分鐘刷新顯示(Worker 端30分算一次)
// 恢復上次的頁面
try {
  const last = localStorage.getItem('lastPage');
  goto(last && pages[last] ? last : 'intraday');
} catch(e) {
  goto('intraday');
}
</script>
