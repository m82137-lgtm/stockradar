// 第五批：抓台股可選歷史日期、填下拉、預設選最新
async function fetchTwDates(currentDate) {
  const sel = document.getElementById('tw-date-select');
  if (!sel) return;
  try {
    const res = await fetch(`${NEWS_API}/api/tw-dates`);
    const j = await res.json();
    let dates = (j.ok && Array.isArray(j.dates)) ? j.dates : [];
    if (currentDate && !dates.includes(currentDate)) dates.unshift(currentDate);
    if (!dates.length && currentDate) dates = [currentDate];
    sel.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
    sel.value = currentDate || dates[0] || '';
  } catch(err) {
    if (currentDate) { sel.innerHTML = `<option value="${currentDate}">${currentDate}</option>`; sel.value = currentDate; }
  }
}

// 第五批：切換台股日期 → 最新走即時，歷史走快照
async function onTwDateChange(date) {
  if (!date) return;
  const sel = document.getElementById('tw-date-select');
  const latest = sel && sel.options.length ? sel.options[0].value : '';
  const tbody = document.getElementById('tw-tbody');
  try {
    if (date === latest) {
      const res = await fetch(`${NEWS_API}/api/tw-top50`);
      const data = await res.json();
      if (data.ok) {
        _twData = data.data; renderTwTable(); fetchTwAnalysis();
        const updEl = document.getElementById('tw-updated');
        if (updEl && data.updatedAt) updEl.textContent = new Date(data.updatedAt).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      }
      return;
    }
    const res = await fetch(`${NEWS_API}/api/tw-snapshot?date=${date}`);
    const data = await res.json();
    if (!data.ok || !Array.isArray(data.data)) {
      if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="us-loading">查無 ${date} 的資料</td></tr>`;
      return;
    }
    _twData = data.data;
    _twTags = data.tags && typeof data.tags === 'object' ? data.tags : {};
    renderTwTable();
    renderTwMarketFocus(data.marketFocus);
    renderTwNewcomers(data.newcomerCards);
    renderTwThemeCards(data.themeCards);
    const updEl = document.getElementById('tw-updated');
    if (updEl && data.updatedAt) updEl.textContent = new Date(data.updatedAt).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  } catch(err) {
    if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="us-loading">⚠️ 載入失敗：${err.message}</td></tr>`;
  }
}

async function fetchTwAnalysis() {
  try {
    const res = await fetch(`${NEWS_API}/api/tw-analysis`);
    const a = await res.json();

}

    <div class="us-ai-body"><div class="us-theme-grid">${cardsHtml}</div></div>
  </div>`;

function sortTw(key) {
  if (_twSort === key) {
    _twAsc = !_twAsc;
  } else {
    _twSort = key;
    _twAsc = (key === 'rank' || key === 'code');
  }
  renderTwTable();
}

function twSortRows(rows) {
  const dir = _twAsc ? 1 : -1;
  const k = _twSort;
  const tagOf = s => (_twTags && _twTags[s.code]) ? _twTags[s.code] : '';
  rows.sort((a,b)=>{
    let av, bv;
    if (k === 'rank')       { av = a.rank||0;        bv = b.rank||0; }
    else if (k === 'code')  { return dir * String(a.code).localeCompare(String(b.code)); }
    else if (k === 'price') { av = a.price||0;       bv = b.price||0; }
    else if (k === 'chg')   { av = a.chg||0;         bv = b.chg||0; }
    else if (k === 'days')  { av = a.days||0;        bv = b.days||0; }
    else if (k === 'theme') { return dir * tagOf(a).localeCompare(tagOf(b), 'zh-Hant'); }
    else                    { av = a.tradeValue||0;  bv = b.tradeValue||0; }   // val
    return dir * (av - bv);
  });
  return rows;
}

// ── Top50 三段篩選：全部 / 漲停 / 漲5% ──
// 門檻 9.5 跟 server.js afterhours 的 prevLimit 同一條線；純前端篩 _twData，不動 Render/KV/定榜帳本
const TW_LIMIT = 9.5, TW_HOT = 5;
let _twFilter = 'all';   // all | lim | hot

function twFilterRows(rows) {
  if (_twFilter === 'lim') return rows.filter(s => (+s.chg) >= TW_LIMIT);
  if (_twFilter === 'hot') return rows.filter(s => (+s.chg) >= TW_HOT);
  return rows;
}
function setTwFilter(m) { _twFilter = m; renderTwTable(); }

function paintTwSegs() {
  const box = document.getElementById('tw-segs');
  if (!box) return;
  const nAll = _twData.length;
  const nLim = _twData.filter(s => (+s.chg) >= TW_LIMIT).length;
  const nHot = _twData.filter(s => (+s.chg) >= TW_HOT).length;
  // 選中的那格被篩到 0（換日/重整）→ 退回全部，不要留一張空表
  if ((_twFilter === 'lim' && !nLim) || (_twFilter === 'hot' && !nHot)) _twFilter = 'all';
  const b = (m, label, n) =>
    `<button class="${_twFilter === m ? 'on' : ''}"${n ? '' : ' disabled'} onclick="setTwFilter('${m}')">${label} <span class="n">${n}</span></button>`;
  box.innerHTML = b('all', '全部', nAll) + b('lim', '🚀 漲停', nLim) + b('hot', '🔥 漲5%', nHot);
}

function renderTwTable() {
  const tbody = document.getElementById('tw-tbody');
  if (!tbody || !_twData.length) return;
  paintTwSegs();                                    // 先畫鈕（可能把失效的篩選退回 all）
  const rows = twSortRows(twFilterRows([..._twData]));
  // 更新表頭箭頭與 active 樣式（用 tbody 往上找同一張表的 thead）
  const table = tbody.closest('table');
  const headMap = { rank:'us-th-rank', code:'us-th-code', price:'us-th-price', chg:'us-th-chg', days:'us-th-days', val:'us-th-val', theme:'us-th-theme' };
  if (table) Object.entries(headMap).forEach(([key, cls])=>{
    const th = table.querySelector('th.' + cls);
    if (!th) return;
    th.classList.toggle('us-sort-active', _twSort === key);
    const old = th.querySelector('.us-arrow'); if (old) old.remove();
    if (_twSort === key) {
      const sp = document.createElement('span');
      sp.className = 'us-arrow';
      sp.textContent = _twAsc ? ' ▲' : ' ▼';
      th.appendChild(sp);
    }
  });
  tbody.innerHTML = rows.map((s,i)=>{
    const chgCls = s.chg > 0 ? 'us-up' : (s.chg < 0 ? 'us-down' : '');
    const chgTxt = (s.chg > 0 ? '+' : '') + (s.chg ?? 0).toFixed(2) + '%';
    const newBadge = s.isNew ? '<span class="us-new">NEW</span>' : '';
    let rankMark = '';
    if (!s.isNew && s.rankChange) {
      if (s.rankChange > 0) rankMark = `<span class="us-rank-up">▲${s.rankChange}</span>`;
      else if (s.rankChange < 0) rankMark = `<span class="us-rank-down">▼${Math.abs(s.rankChange)}</span>`;
    }
    const tag = (_twTags && _twTags[s.code]) ? _twTags[s.code] : '—';
    const isOtc = s.market === 'OTC';
    const mktBadge = `<span class="tw-mkt ${isOtc ? 'tw-mkt-otc' : 'tw-mkt-tse'}">${isOtc ? '櫃' : '市'}</span>`;
    return `<tr onclick="openTwNews('${s.code}','${(s.name||'').replace(/'/g,'')}')">
      <td class="us-td-rank">${s.rank||i+1}${rankMark}</td>
      <td class="us-td-code">${newBadge}${s.code}${mktBadge}<a class="us-td-name" href="https://tw.tradingview.com/chart/?symbol=${encodeURIComponent((s.market==='OTC'?'TPEX:':'TWSE:')+s.code)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${s.name||''}</a></td>
      <td class="us-td-price">${(s.price ?? 0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td class="us-td-chg ${chgCls}">${chgTxt}</td>
      <td class="us-td-val">${fmtTwVal(s.tradeValue)}</td>
      <td class="us-td-nh">${s.newHigh ? '<span class="us-hi"><b>🔥新高</b>' + (nhSpan(s.nhD) ? '<small>' + nhSpan(s.nhD) + '</small>' : '') + '</span>' : '<span style="color:var(--text3)">—</span>'}</td>
      <td class="us-td-days">${s.days||1}<span class="us-days-unit">天</span></td>
      <td class="us-td-theme">${tag}</td>
    </tr>`;
  }).join('');
}

// 台股成交值（元）格式化：億 / 萬
function fmtTwVal(v) {
  if (!v) return '—';
  if (v >= 1e8) return (v/1e8).toFixed(2) + '億';
  if (v >= 1e4) return (v/1e4).toFixed(0) + '萬';
  return v.toLocaleString();
}

// 點台股個股 → 開 app 內個股新聞面板（資料源同盤後追蹤 /api/stock-news）
function openTwNews(code, name) {
  const s = _twData.find(x => x.code === code) || { code, name };
  const ov     = document.getElementById('tw-news-overlay');
  const stockEl= document.getElementById('twn-stock');
  const cntEl  = document.getElementById('twn-cnt');
  const listEl = document.getElementById('tw-news-list');
  if (!ov || !stockEl || !listEl) return;
  // 標頭：股名 + 市/櫃 + 股號 + 報價漲跌（紅漲綠跌）
  const isOtc = s.market === 'OTC';
  const mkt = `<span class="tw-mkt ${isOtc ? 'tw-mkt-otc' : 'tw-mkt-tse'}">${isOtc ? '櫃' : '市'}</span>`;
  const chg = +(s.chg || 0);
  const col = chg >= 0 ? 'var(--red)' : 'var(--green)';
  const pr  = (s.price != null)
    ? `<span class="pr" style="color:${col}">${(+s.price).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}　${chg>=0?'↗':'↘'} ${(chg>=0?'+':'')+chg.toFixed(2)}%</span>`
    : '';
  stockEl.innerHTML = `<span class="nm">${s.name || name || code}</span>${mkt}<span class="cd">${code}</span>${pr}`;
  if (cntEl) cntEl.textContent = '';
  ov.hidden = false;
  document.body.style.overflow = 'hidden';
  listEl.innerHTML = '<div class="twn-empty">📰 載入新聞中…</div>';
  // 關鍵字比照盤後追蹤：只帶股名（抓不到才用股號）
  const keyword = String(s.name || name || code || '').trim();
  fetchTwNews(code, keyword);
}

async function fetchTwNews(code, keyword) {
  const listEl = document.getElementById('tw-news-list');
  if (!listEl) return;
  const cacheKey = `${code}-${keyword}`;
  let base = newsCache[cacheKey];
  if (!base) {
    try {
      const res  = await fetch(`${NEWS_API}/api/stock-news?name=${encodeURIComponent(keyword)}&code=${encodeURIComponent(code)}`);
      const rows = await res.json();
      base = normalizeRenderStockNews(rows, code, keyword);
      newsCache[cacheKey] = base;
    } catch {
      listEl.innerHTML = '<div class="twn-empty">⚠️ 新聞載入失敗，請稍後再試<br><span style="font-size:11px;">（Render 免費版若休眠中，第一次查詢需等幾秒喚醒，再點一次即可）</span></div>';
      return;
    }
  }
  // 保險：前端再按發稿時間新→舊排序（後端已排，這裡確保萬無一失），取最新 15 則
  const items = base.slice().sort((a, b) =>
    (new Date(b.pub).getTime() || 0) - (new Date(a.pub).getTime() || 0)
  ).slice(0, 15);
  renderTwNews(items);
}

function renderTwNews(items) {
  const listEl = document.getElementById('tw-news-list');
  const cntEl  = document.getElementById('twn-cnt');
  if (!listEl) return;
  if (!items || !items.length) {
    listEl.innerHTML = '<div class="twn-empty">目前查無相關新聞</div>';
    if (cntEl) cntEl.textContent = '';
    return;
  }
  if (cntEl) cntEl.textContent = `共 ${items.length} 則`;
  const cards = items.map((n, i) => {
    const d = new Date(n.pub);
    const t = isNaN(d) ? '' : d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const num = String(i + 1).padStart(2, '0');
    return `<a href="${n.link}" target="_blank" rel="noopener" class="twn-card" style="animation:fadeIn2 0.2s ease ${i*0.015}s both">
      <span class="twn-card-num">${num}</span>
      <div class="twn-card-body">
        <div class="twn-card-title">${n.title}</div>
        <div class="twn-card-meta">
          <span>🕐</span><span style="font-family:'JetBrains Mono',monospace;">${t}</span>
          <span>📋</span><span class="news-source">${n.src || 'Google 新聞'}</span>
        </div>
      </div></a>`;
  }).join('');
  listEl.innerHTML = `<div class="twn-list-inner">${cards}</div>`;
  listEl.scrollTop = 0;
}

function closeTwNews() {
  const ov = document.getElementById('tw-news-overlay');
  if (ov) ov.hidden = true;
  document.body.style.overflow = '';
}

// ── 熱門族群內文閱讀器（Readability 後端 /api/article）──
let _sectorItems = [];      // renderSectors 存的目前清單（給上一則/下一則翻頁）
let _secReaderIdx = -1;
const _articleCache = {};

function openSecReader(idx) {
  if (idx < 0 || idx >= _sectorItems.length) return;
  _secReaderIdx = idx;
  const n = _sectorItems[idx];
  const ov = document.getElementById('sec-reader-overlay');
  if (!ov) return;
  ov.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('secr-src').textContent = n.src || '富聯網';
  // 翻頁鈕狀態
  document.getElementById('secr-prev').disabled = (idx <= 0);
  document.getElementById('secr-next').disabled = (idx >= _sectorItems.length - 1);
  if (n.url) {
    markRead(n.url);   // 讀過就標記（跟點卡片一致）
    // 立刻把對應的族群卡片反灰（不用等重新 render）
    const cards = document.querySelectorAll('.sector-news-card');
    if (cards[idx]) cards[idx].classList.add('read');
  }
  renderSecArticle(n);
}

function secReaderNav(dir) {
  const next = _secReaderIdx + dir;
  if (next < 0 || next >= _sectorItems.length) return;
  openSecReader(next);
  const sc = document.getElementById('secr-scroll');
  if (sc) sc.scrollTop = 0;
}

function closeSecReader() {
  const ov = document.getElementById('sec-reader-overlay');
  if (ov) ov.hidden = true;
  document.body.style.overflow = '';
}

async function renderSecArticle(n) {
  const body = document.getElementById('secr-body');
  if (!body) return;
  const d = new Date(n.time || 0);
  const dateStr = n.time && !isNaN(d.getTime())
    ? d.toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})
    : (n.time || '');
  const rel = relTimeAgo(n.time);
  const head =
    `<div class="secr-title">${hlHotKw(n.title || '')}</div>` +
    `<div class="secr-meta"><span>🕐</span>${rel ? `<span class="sec-rel">${rel}</span><span style="opacity:.55;">·</span>` : ''}<span class="sec-abs">${dateStr}</span><span>📋</span><span style="color:var(--accent);font-weight:500;">${n.src||'富聯網'}</span></div>`;
  // 有快取直接用
  if (_articleCache[n.url]) {
    body.innerHTML = head + `<div class="secr-content">${_articleCache[n.url]}</div>`;
    return;
  }
  body.innerHTML = head + `<div class="secr-empty">📖 載入內文中…</div>`;
  try {
    const res  = await fetch(`${NEWS_API}/api/article?url=${encodeURIComponent(n.url)}`);
    const json = await res.json();
    if (_secReaderIdx < 0 || _sectorItems[_secReaderIdx]?.url !== n.url) return; // 已翻頁，丟棄舊結果
    if (json && json.ok && json.content) {
      _articleCache[n.url] = json.content;
      body.innerHTML = head + `<div class="secr-content">${json.content}</div>`;
    } else {
      body.innerHTML = head + `<div class="secr-empty">內文擷取失敗<br><span style="font-size:11px;">可點卡片改看原文，或稍後再試（Render 免費版若休眠中需等幾秒喚醒）</span></div>`;
    }
  } catch {
    body.innerHTML = head + `<div class="secr-empty">⚠️ 載入失敗，請稍後再試<br><span style="font-size:11px;">（Render 免費版若休眠中，第一次需等幾秒喚醒，返回再點一次）</span></div>`;
  }
}

// ── 美股 Top50（第一批：行情7欄表格）──────────────
let _usData = [];
let _usSort = 'val';
let _usAsc = false;   // false=降序(大→小)、true=升序
let _usTags = {};   // 每檔題材標籤（後續批次填）

async function fetchUsTop50() {
  const tbody = document.getElementById('us-tbody');
  if (!tbody) return;
  try {
    const res  = await fetch(`${NEWS_API}/api/us-top50`);
    const json = await res.json();
    if (!json.ok || !Array.isArray(json.data) || !json.data.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="us-loading">美股資料尚未產生<br><span style="font-size:12px;color:var(--text3);display:block;margin-top:8px;">每交易日約台北 06:00 自動更新</span></td></tr>';
      return;
    }
    _usData = json.data;
    const updEl = document.getElementById('us-updated');
    if (updEl && json.updatedAt) updEl.textContent = new Date(json.updatedAt).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    renderUsTable();
    fetchUsAnalysis();          // 抓最新 AI 分析
    fetchUsDates(json.date);    // 填歷史日期下拉、預設選最新
  } catch(err) {
    tbody.innerHTML = `<tr><td colspan="7" class="us-loading">⚠️ ${err.message}<br><button class="btn btn-primary" style="margin-top:12px;" onclick="fetchUsTop50()">重試</button></td></tr>`;
  }
}

// 第五批：抓可選歷史日期、填下拉、預設選 currentDate
async function fetchUsDates(currentDate) {
  const sel = document.getElementById('us-date-select');
  if (!sel) return;
  try {
    const res = await fetch(`${NEWS_API}/api/us-dates`);
    const j = await res.json();
    let dates = (j.ok && Array.isArray(j.dates)) ? j.dates : [];
    if (currentDate && !dates.includes(currentDate)) dates.unshift(currentDate);
    if (!dates.length && currentDate) dates = [currentDate];
    sel.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
    sel.value = currentDate || dates[0] || '';
  } catch(err) {
    // 失敗就退化成只顯示當前日期
    if (currentDate) { sel.innerHTML = `<option value="${currentDate}">${currentDate}</option>`; sel.value = currentDate; }
  }
}

// 第五批：切換日期 → 載入該天快照（最新那天走即時 us-top50，歷史走 us-snapshot）
async function onUsDateChange(date) {
  if (!date) return;
  const sel = document.getElementById('us-date-select');
  const latest = sel && sel.options.length ? sel.options[0].value : '';
  const tbody = document.getElementById('us-tbody');
  try {
    let data;
    if (date === latest) {
      // 選最新 → 用即時資料（含當前 analysis）
      const res = await fetch(`${NEWS_API}/api/us-top50`);
      data = await res.json();
      if (data.ok) {
        _usData = data.data; renderUsTable(); fetchUsAnalysis();
        const updEl = document.getElementById('us-updated');
        if (updEl && data.updatedAt) updEl.textContent = new Date(data.updatedAt).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      }
      return;
    }
    // 歷史某天 → 讀快照
    const res = await fetch(`${NEWS_API}/api/us-snapshot?date=${date}`);
    data = await res.json();
    if (!data.ok || !Array.isArray(data.data)) {
      if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="us-loading">查無 ${date} 的資料</td></tr>`;
      return;
    }
    _usData = data.data;
    _usTags = data.tags && typeof data.tags === 'object' ? data.tags : {};
    renderUsTable();
    renderMarketFocus(data.marketFocus);
    renderNewcomers(data.newcomerCards);
    renderThemeCards(data.themeCards);
    const updEl = document.getElementById('us-updated');
    if (updEl && data.updatedAt) updEl.textContent = new Date(data.updatedAt).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  } catch(err) {
    if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="us-loading">⚠️ 載入失敗：${err.message}</td></tr>`;
  }
}

// 抓 AI 題材分析：填表格題材欄 + 渲染發動題材卡片
async function fetchUsAnalysis() {
  try {
    const res = await fetch(`${NEWS_API}/api/us-analysis`);
    const a = await res.json();
    if (!a.ok) return;
    if (a.tags && typeof a.tags === 'object') { _usTags = a.tags; renderUsTable(); }
    renderMarketFocus(a.marketFocus);
    renderNewcomers(a.newcomerCards);
    renderThemeCards(a.themeCards);
  } catch(err) { /* AI失敗不影響表格 */ }
}

  const happenedHtml = (mf.happened||[]).map(e=>`
    <div class="us-focus-item"><span class="us-focus-item-title">${e.title||''}</span><span class="us-focus-item-dash"> — </span><span class="us-focus-item-desc">${e.desc||''}</span></div>`).join('');
  const upcomingHtml = (mf.upcoming||[]).map(e=>`
    <div class="us-focus-item">${e.date ? `<span class="us-focus-item-date">${e.date}</span>` : ''}<span class="us-focus-item-title">${e.title||''}</span><span class="us-focus-item-dash"> — </span><span class="us-focus-item-desc">${e.desc||''}</span></div>`).join('');
  slot.innerHTML = `<div class="us-ai-card us-collapsed" id="us-card-focus">

    <div class="us-ai-body">
    ${mf.summary ? `<div class="us-focus-summary">${mf.summary}</div>` : ''}
    <div class="us-focus-cols">
      <div class="us-focus-col">
        <div class="us-focus-col-head">重大事件（已發生）</div>
        ${happenedHtml || '<div class="us-focus-empty">今日無重大事件資料。</div>'}
      </div>
      <div class="us-focus-col">

        ${upcomingHtml || '<div class="us-focus-empty">暫無即將到來的事件。</div>'}

    </div>
    </div>

  if (!Array.isArray(cards) || !cards.length) {
    slot.innerHTML = `<div class="us-ai-card us-collapsed" id="us-card-nc">${head}<div class="us-ai-body"><div class="us-focus-empty">今日無新進榜個股（無個股首次衝進前 50）。</div></div></div>`;
    return;
  }
  const cardsHtml = cards.map(s=>{
    const chgCls = s.chg > 0 ? 'us-up' : (s.chg < 0 ? 'us-down' : '');
    const chgTxt = (s.chg > 0 ? '+' : '') + (s.chg ?? 0).toFixed(2) + '%';
    return `<div class="us-nc-card" onclick="openUsNews('${s.code}')">
      <div class="us-nc-top">
        <span class="us-nc-code">${s.code}</span>
        <span class="us-nc-chg ${chgCls}">${chgTxt}</span>
      </div>

      ${s.tag ? `<div class="us-nc-tag">${s.tag}</div>` : ''}
      <div class="us-nc-event">${s.event||''}</div>

  slot.innerHTML = `<div class="us-ai-card us-collapsed" id="us-card-nc">${head}<div class="us-ai-body"><div class="us-nc-grid">${cardsHtml}</div></div></div>`;
}

function renderThemeCards(cards) {
  const slot = document.getElementById('us-theme-slot');
  if (!slot) return;
  if (!Array.isArray(cards) || !cards.length) { slot.innerHTML = ''; return; }
  const cardsHtml = cards.map(t=>{
    const chgCls = t.chg > 0 ? 'us-up' : (t.chg < 0 ? 'us-down' : '');
    const chgTxt = (t.chg > 0 ? '+' : '') + (t.chg ?? 0).toFixed(2) + '%';
    const codeBtns = (t.codes||[]).map(c=>`<span class="us-theme-code" onclick="event.stopPropagation();openUsNews('${c}')">${c}</span>`).join('');

      <div class="us-theme-top"><span class="us-theme-name">${t.name}</span><span class="us-theme-chg ${chgCls}">${chgTxt}</span></div>

    <div class="us-ai-body"><div class="us-theme-grid">${cardsHtml}</div></div>

function toggleUsCard(id) {
  const card = document.getElementById(id);
  if (!card) return;
  card.classList.toggle('us-collapsed');
  const arrow = card.querySelector('.us-collapse-arrow');
  if (arrow) arrow.textContent = card.classList.contains('us-collapsed') ? '展開 ▼' : '收起 ▲';
}

function sortUs(key) {
  // 同欄再點 = 切換升/降序；換欄 = 預設降序（名次/代碼預設升序）
  if (_usSort === key) {
    _usAsc = !_usAsc;
  } else {
    _usSort = key;
    _usAsc = (key === 'rank' || key === 'code');   // 名次、代碼預設小→大；其餘大→小
  }
  renderUsTable();
}

function usSortRows(rows) {
  const dir = _usAsc ? 1 : -1;
  const k = _usSort;
  const tagOf = s => (_usTags && _usTags[s.code]) ? _usTags[s.code] : '';
  rows.sort((a,b)=>{
    let av, bv;
    if (k === 'rank')       { av = a.rank||0;       bv = b.rank||0; }
    else if (k === 'code')  { return dir * String(a.code).localeCompare(String(b.code)); }
    else if (k === 'price') { av = a.price||0;      bv = b.price||0; }
    else if (k === 'chg')   { av = a.chg||0;        bv = b.chg||0; }
    else if (k === 'days')  { av = a.days||0;       bv = b.days||0; }
    else if (k === 'theme') { return dir * tagOf(a).localeCompare(tagOf(b), 'zh-Hant'); }
    else                    { av = a.dollarVol||0;  bv = b.dollarVol||0; }   // val
    return dir * (av - bv);
  });
  return rows;
}

// 在表頭該欄標題加箭頭
function usSortArrow(key) {
  if (_usSort !== key) return '';
  return `<span class="us-arrow">${_usAsc ? '▲' : '▼'}</span>`;
}

function renderUsTable() {
  const tbody = document.getElementById('us-tbody');
  if (!tbody || !_usData.length) return;
  const rows = usSortRows([..._usData]);
  // 更新表頭箭頭與 active 樣式（用 tbody 往上找同一張表的 thead，不依賴頁面 class）
  const table = tbody.closest('table');
  const headMap = { rank:'us-th-rank', code:'us-th-code', price:'us-th-price', chg:'us-th-chg', days:'us-th-days', val:'us-th-val', theme:'us-th-theme' };
  if (table) Object.entries(headMap).forEach(([key, cls])=>{
    const th = table.querySelector('th.' + cls);
    if (!th) return;
    th.classList.toggle('us-sort-active', _usSort === key);
    const old = th.querySelector('.us-arrow'); if (old) old.remove();
    if (_usSort === key) {
      const sp = document.createElement('span');
      sp.className = 'us-arrow';
      sp.textContent = _usAsc ? ' ▲' : ' ▼';
      th.appendChild(sp);
    }
  });
  tbody.innerHTML = rows.map((s,i)=>{
    const chgCls = s.chg > 0 ? 'us-up' : (s.chg < 0 ? 'us-down' : '');
    const chgTxt = (s.chg > 0 ? '+' : '') + (s.chg ?? 0).toFixed(2) + '%';
    const newBadge = s.isNew ? '<span class="us-new">NEW</span>' : '';
    let rankMark = '';
    if (!s.isNew && s.rankChange) {
      if (s.rankChange > 0) rankMark = `<span class="us-rank-up">▲${s.rankChange}</span>`;
      else if (s.rankChange < 0) rankMark = `<span class="us-rank-down">▼${Math.abs(s.rankChange)}</span>`;
    }
    const tag = (_usTags && _usTags[s.code]) ? _usTags[s.code] : '—';
    return `<tr onclick="openUsNews('${s.code}')">
      <td class="us-td-rank">${s.rank||i+1}${rankMark}</td>
      <td class="us-td-code">${newBadge}${s.code}<a class="us-td-name" href="https://tw.tradingview.com/chart/?symbol=${encodeURIComponent(s.code)}" target="_blank" rel="noopener" title="${(s.name||'').replace(/"/g,'')}" onclick="event.stopPropagation()">${s.zh || s.name || ''}</a></td>
      <td class="us-td-price">$${(s.price ?? 0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td class="us-td-chg ${chgCls}">${chgTxt}</td>
      <td class="us-td-days">${s.days||1}<span class="us-days-unit">天</span></td>
      <td class="us-td-val">${fmtDollarVol(s.dollarVol)}</td>
      <td class="us-td-theme">${tag}</td>
    </tr>`;
  }).join('');
}

function fmtDollarVol(v) {

async function fetchUsNews(code) {
  const listEl = document.getElementById('tw-news-list');
  if (!listEl) return;
  const cacheKey = `us-${code}`;
  let base = newsCache[cacheKey];
  if (!base) {
    try {
      // 中文模式：搜「美股 + 代號」，偏向台灣/中文媒體寫的美股新聞（短代號仍可能有雜訊）
      const res  = await fetch(`${NEWS_API}/api/stock-news?name=${encodeURIComponent('美股')}&code=${encodeURIComponent(code)}`);
      const rows = await res.json();
      base = normalizeRenderStockNews(rows, code, code);
      newsCache[cacheKey] = base;
    } catch {
      listEl.innerHTML = '<div class="twn-empty">⚠️ 新聞載入失敗，請稍後再試<br><span style="font-size:11px;">（Render 免費版若休眠中，第一次查詢需等幾秒喚醒，再點一次即可）</span></div>';
      return;
    }
  }
  // 按發稿時間新→舊排序，取最新 15 則
  const items = base.slice().sort((a, b) =>
    (new Date(b.pub).getTime() || 0) - (new Date(a.pub).getTime() || 0)
  ).slice(0, 15);
  renderTwNews(items);
}

//   驗證：FinLab 公布 2026-06-09 = 1.98，本站同日算出 198.2（我們只有上市、仍吻合）。
//   四條線照 FinLab：1.80 過熱／1.67 中位（≈上市初始 1/0.6）／1.40 斷頭壓力／1.30 地板

//   橘線＝10 日均線：單日會跳，方向才有意義；FinLab 擇時規則即以 10MA 跌破 1.42 進、突破 1.84 出。

function chipRatioSvg(series) {

  if (mpts) svg += `<polyline points="${mpts}" fill="none" stroke="var(--amber)" stroke-width="1.2" opacity=".95" vector-effect="non-scaling-stroke"/>`;

  let labels = '';
  for (const [v, c, txt] of REF) labels += `<span class="chip-refl" style="top:${(yf(v) * 100).toFixed(1)}%;color:${c}">${txt}</span>`;

// 維持率 10 日均線（跳過 null；不滿 10 筆有效值不畫）

      ed.innerHTML = stamp(o) + val + `變動 ${dv == null ? '<span style="color:var(--text3)">—</span>' : chipDelta(dv, '口')}`;
    }
  });
  // 散戶卡合約章（小台 MTX＝主圖、微台 TMF＝副圖；label 由 server 給，哪個沒資料哪個不出現）
  [['cprT', D.retail], ['cpr2T', D.retail2]].forEach(([id, pack]) => {
    const t = el(id);
    if (!t) return;
    if (!pack) { t.textContent = ''; return; }
    t.textContent = pack.label || '';
    t.style.background = 'var(--bg4)';
    t.style.color = 'var(--text2)';
  });
  // 融資餘額
  if (D.margin && el('cpmV')) {
    const ob = pickNZ(D.margin.balSeries || null), oc = pickNZ(D.margin.series);
    const bv = ob ? ob.p.v : (D.margin.bal != null ? D.margin.bal : null);
    el('cpmV').textContent = bv == null ? '未公布' : chipFmt(bv, '億');
    const cv = oc ? oc.p.v : null;
    el('cpmD').innerHTML = stamp(oc || ob) + (cv == null ? `<span style="color:var(--text3)">尚未公布（約 22:10 後）</span>` : `變動 ${chipDelta(cv, '億')}`);
    // 維持率副圖讀數：水位章＋現值＋較昨變動（刮動時跟游標跳）
    const mrd = el('cpmrD');
    if (mrd && D.margin.ratioSeries && D.margin.ratioSeries.length) {
      const orr = pickNZ(D.margin.ratioSeries), rv = orr ? orr.p.v : null;
      if (rv == null) mrd.innerHTML = `<span style="color:var(--text3)">未公布</span>`;
      else {
        const z = ratioZone(rv), rc = dd(orr);
        // 不放 10MA 數字：橘線畫在圖上就夠了，硬塞會讓手機那行爆掉（07-16 中招過）
        mrd.innerHTML = `<span class="cp-vixtag" style="background:${z[1]};color:${z[2]};margin-right:5px">${z[0]}</span>` +
          `<b style="color:var(--text);font-size:11.5px">${rv.toFixed(1)}%</b>` +
          (rc == null ? '' : ` ${chipDelta(rc, '')}`);
      }
    }
  }
  // 台指 VIX（大字現值＋水位標籤＋升紅降綠變動）
  if (D.vix && D.vix.series && el('cpvixV')) {
    const ov = pickNZ(D.vix.series), v = ov ? ov.p.v : null;
    if (v == null) {   // 刮到未公布日
      el('cpvixV').textContent = '未公布';
      const t = el('cpvixT');
      if (t) { t.textContent = '—'; t.style.background = 'var(--bg3)'; t.style.color = 'var(--text3)'; }
      el('cpvixD').innerHTML = stamp(ov) + `<span style="color:var(--text3)">尚未公布</span>`;
    } else {
      el('cpvixV').textContent = v.toFixed(2);
      const t = el('cpvixT');
      if (t) { const z = vixZone(v); t.textContent = z[0]; t.style.background = z[1]; t.style.color = z[2]; }
      const pv = (ov.prev && ov.prev.v != null) ? ov.prev.v : null;
      const vc = pv != null ? (v - pv) : (D.vix.chg || 0);
      el('cpvixD').innerHTML = stamp(ov) + `變動 <span class="${cls(vc)}">${(vc >= 0 ? '+' : '') + vc.toFixed(2)}</span>`;
    }
  }
  document.querySelectorAll('.chip-cursor').forEach(c => {
    c.style.opacity = active ? 1 : 0;
    if (!active) return;
    const z = c.parentElement;
    const n = +((z && z.dataset.n) || 0);
    let pct;
    if (n > 1) {
      const k = Math.round(frac * (n - 1));
      pct = z.dataset.line ? (k / (n - 1) * 100) : ((k + 0.5) / n * 100);
    } else pct = frac * 100;
    c.style.left = `calc(${pct.toFixed(2)}% - 1px)`;
  });
}
function chipBindScrub() {
  document.querySelectorAll('[data-chipzone]').forEach(z => {
    const calc = e => {
      const r = z.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      return Math.max(0, Math.min(1, x / r.width));
    };
    const on = e => { chipSet(true, calc(e)); if (e.cancelable) e.preventDefault(); };
    z.addEventListener('mousemove', on);
    z.addEventListener('mouseleave', () => chipSet(false, 0));
    z.addEventListener('touchstart', on, { passive: false });
    z.addEventListener('touchmove', on, { passive: false });
    z.addEventListener('touchend', () => chipSet(false, 0));
  });
}
async function loadChipIndicators() {
  const box = document.getElementById('chip-cards');
  if (!box) return;
  try {
    const r = await fetch(`${WORKER}/api/chip-indicators`);
    const d = await r.json();
    if (!d || !d.ok) return;
    CHIP = d;
    // 顯示天數依裝置切片：手機近30天、桌機近60天（server 存60；六卡同切，游標日期軸一致）
    const CHIP_N = window.matchMedia('(max-width: 639px)').matches ? 30 : 60;
    const cut = a => Array.isArray(a) ? a.slice(-CHIP_N) : a;
    if (d.idx) { for (const k of ['tse', 'otc']) if (d.idx[k] && d.idx[k].series) d.idx[k].series = cut(d.idx[k].series); }
    // ══ 六卡日期軸對齊（07-15）：主軸=加權（缺則櫃買）已切片日期序列；落後指標按日期入座、未公布=null（渲染成虛線空格、游標顯示未公布）══
    const mastSer = d.idx && ((d.idx.tse && d.idx.tse.series) || (d.idx.otc && d.idx.otc.series));
    const axis = Array.isArray(mastSer) ? mastSer.map(b => b.d) : null;
    const alignByDate = ser => {
      if (!axis || !Array.isArray(ser)) return cut(ser);
      const mp = new Map(ser.map(pt => [pt.d, pt]));
      return axis.map(dd2 => mp.get(dd2) || { d: dd2, v: null });
    };
    for (const k of ['foreign', 'retail', 'retail2']) if (d[k] && d[k].series) d[k].series = alignByDate(d[k].series);
    if (d.margin) {
      d.margin.series = alignByDate(d.margin.series);
      if (d.margin.balSeries) d.margin.balSeries = alignByDate(d.margin.balSeries);
      // 維持率也要按日期入座，否則副圖會跟主軸錯開（TWSE 與 FinMind 的交易日可能差一天）
      if (d.margin.ratioSeries) d.margin.ratioSeries = alignByDate(d.margin.ratioSeries);
    }
    if (d.vix && d.vix.series) d.vix.series = alignByDate(d.vix.series);
    const idxCard = (key, title, pack) => !pack ? chipPh(title) :
      `<div class="cp-card"><div class="cp-h1"><span class="cp-t">${title}</span><span class="chip-windchip inrow" id="${key}W"></span><span class="cp-v cp-vbig" id="${key}C" style="margin-left:auto"></span></div>` +
      `<div class="cp-h2"><span id="${key}M"></span><span id="${key}D" style="text-align:right"></span></div>` +
      `<div class="cp-h3"><span class="chip-live-ts" id="${key}Ts"></span></div>` +
      `<div class="chip-trend" id="${key}Trend" style="display:none;"><div class="trend-row"><span class="trend-lbl" id="${key}TrL"></span><span class="trend-time" id="${key}TrT"></span></div><div id="${key}TrSvg"></div></div>` +
      chipZone(`<div id="${key}Chart">${chipIdxSvg(pack.series)}</div><span class="chip-today-lbl" id="${key}Tl"></span>` +
        ((pack.series[pack.series.length - 1] || {}).dif != null ? `<div class="chip-macd"><div class="macd-row"><span class="macd-lbl">MACD</span><span class="macd-val" id="${key}Mv"></span></div><div id="${key}Macd">${chipMacdSvg(pack.series)}</div></div>` : ''),
        pack.series.length) +
      `<div class="cp-ohlc" id="${key}Ohlc"></div></div>`;
    const barCard = (key, title, pack) => !pack ? chipPh(title) :
      `<div class="cp-card"><div class="cp-h1"><span class="cp-t">${title}</span><span class="cp-v" id="cp${key}V"></span></div>` +
      `<div class="cp-h2"><span></span><span id="cp${key}D" style="text-align:right"></span></div>` +
      chipZone(chipBars2(pack.series), pack.series.length) + `</div>`;
    const rows = [];
    if (d.idx && (d.idx.tse || d.idx.otc)) {
      rows.push(`<div class="chip-grid2">${idxCard('kt', '加權', d.idx.tse)}${idxCard('ko', '櫃買', d.idx.otc)}</div>`);
    }
    // 2026-07-15 六卡重排：VIX 上到排2、散戶卡下到排3
    //   排2＝外資OI(2層) | VIX(2層)          → 等高
    //   排3＝融資+維持率(3層) | 散戶OI 小台+微台(3層) → 等高
    const vixC = (d.vix && d.vix.series && d.vix.series.length) ?
      `<div class="cp-card"><div class="cp-h1"><span class="cp-t">台指 VIX</span><span class="cp-v" id="cpvixV"></span></div>` +
      `<div class="cp-h2"><span class="cp-vixtag" id="cpvixT"></span><span id="cpvixD" style="text-align:right"></span></div>` +
      chipZone(`<div>${chipVixSvg(d.vix.series)}</div>`, d.vix.series.length, true) + `</div>`
      : chipPh('台指 VIX');
    if (d.foreign || d.vix) {
      rows.push(`<div class="chip-grid2">${barCard('f', '外資台指OI', d.foreign)}${vixC}</div>`);
    }
    if (d.margin || d.retail) {
      // 融資卡：報價列＋變動柱＋融資熱度副圖（反向情緒指標：1.80過熱／1.67中位／1.40斷頭壓力／1.30地板＋10MA）
      const balC = d.margin ? `<div class="cp-card"><div class="cp-h1"><span class="cp-t">融資餘額</span><span class="cp-v" id="cpmV"></span></div>` +
        `<div class="cp-h2"><span></span><span id="cpmD" style="text-align:right"></span></div>` +
        chipZone(chipBars2(d.margin.series), d.margin.series.length) +
        ((d.margin.ratioSeries && d.margin.ratioSeries.length)
          ? `<div class="cp-sub"><span>融資熱度</span><span id="cpmrD"></span></div>` +
            chipZone(`<div>${chipRatioSvg(d.margin.ratioSeries)}</div>`, d.margin.ratioSeries.length, true)
          : '') + `</div>`
        : chipPh('融資餘額');
      // 散戶卡：報價列＋小台柱＋微台副圖（不互相頂替，哪個沒資料哪個空）
      const retC = d.retail ? `<div class="cp-card"><div class="cp-h1"><span class="cp-t">散戶OI</span><span class="cp-v" id="cprV"></span></div>` +
        `<div class="cp-h2"><span class="cp-vixtag" id="cprT"></span><span id="cprD" style="text-align:right"></span></div>` +
        chipZone(chipBars2(d.retail.series), d.retail.series.length) +
        ((d.retail2 && d.retail2.series && d.retail2.series.length)
          ? `<div class="cp-sub"><span><span class="cp-vixtag" id="cpr2T"></span></span><span id="cpr2D"></span></div>` +
            chipZone(chipBars2(d.retail2.series), d.retail2.series.length)
          : '') + `</div>`
        : chipPh('散戶OI');
      rows.push(`<div class="chip-grid2">${balC}${retC}</div>`);
    }
    if (!rows.length) return;
    box.innerHTML = rows.join('') + `<div class="chip-src">指數/期貨籌碼：FinMind（證交所＋期交所彙整）· 台指VIX：期交所TAIFEX · 融資餘額/熱度：證交所＋櫃買自算（上市＋上櫃合併·維持率分子不含ETF／反向指標，高=融資擁擠）· 每交易日 17:45／21:45／22:10 更新 · 按住圖表左右滑可看各日</div>`;
    box.style.display = '';
    chipSet(false, 0);
    chipBindScrub();
    // 2026-07-15：CHIP 被整包換掉會連今日即時K 一起洗掉（即時K 只活在 CHIP.idx[k].series 記憶體裡，
    // 新包裹沒有這根；走勢細點另存 idxTrendFine 所以不受影響 → 才會出現「走勢有、K棒沒有」）。
    // 每次點風度頁籤都會重跑本函式 → 不補這行就要等下一輪 idxLiveTick（最多 60 秒）才長回來。
    if (typeof idxLiveTick === 'function') idxLiveTick();
  } catch (e) { console.log('loadChipIndicators fail:', e.message); }
}

// ── Google News 個股新聞 ────────────────────────
const newsCache = {};
const NEWS_MEDIA = ['工商時報','鉅亨網','Yahoo','經濟日報','中國時報','時報資訊','旺德富','旺得富','富聯網','時報'];

function googleNewsSearchUrl(keyword) {
  return `https://news.google.com/search?q=${encodeURIComponent(keyword)}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
}

function cleanGoogleNewsTitle(title) {
  return String(title || '').replace(/ - Google 新聞$/, '').replace(/ - Google News$/, '').trim();
}

function parseRSSItems(raw, fallbackKeyword, fallbackTime) {
  const items = [];
  if (!raw || typeof raw !== 'string') return items;

  try {
    const parser = new DOMParser();
    const xml = parser.parseFromString(raw, 'text/xml');
    const nodes = Array.from(xml.querySelectorAll('item'));
    for (const item of nodes) {
      const title = cleanGoogleNewsTitle(item.querySelector('title')?.textContent || fallbackKeyword || '新聞');
      const link  = item.querySelector('link')?.textContent || googleNewsSearchUrl(fallbackKeyword || title);
      const pub   = item.querySelector('pubDate')?.textContent || fallbackTime || '';
      const src   = item.querySelector('source')?.textContent || 'Google RSS';
      if (title) items.push({ title, link, pub, src });
    }
  } catch(e) {}

  // 目前 Render 後端若只回傳 RSS 前 500 字，可能還沒有 <item>。
  // 這時至少顯示「此股新聞已更新」並連到 Google News 搜尋。
  if (!items.length && fallbackKeyword) {
    items.push({
      title: `${fallbackKeyword} 最新新聞已更新`,
      link: googleNewsSearchUrl(fallbackKeyword),
      pub: fallbackTime || '',
      src: 'Google RSS'
    });
  }
  return items;
}

function normalizeRenderStockNews(rows, code, name) {
  const list = Array.isArray(rows) ? rows : [];
  const out = [];

  for (const r of list) {
    if (Array.isArray(r.items)) {
      for (const n of r.items) {
        out.push({
          title: n.title || '',
          link: n.link || n.url || '',
          pub: n.pub || r.time || '',
          src: n.src || 'Google RSS'
        });
      }
    }
  }

  return out.filter(n => n.title && n.link).slice(0, 30);
}

async function fetchStockNews(code, name, prefix='qj') {
  const el = document.getElementById(`news-${prefix}-${code}`);
  if (!el) return;

  const keyword = String(name || code || '').trim();
  const cacheKey = `${code}-${keyword}`;
  if (newsCache[cacheKey]) {
    renderStockNews(el, newsCache[cacheKey]);
    return;
  }

  // 槽的預設值已改成「📰 看新聞」鈕，所以載入中要自己寫
  el.innerHTML = '<div style="font-size:11px;color:var(--text3);">📰 載入個股新聞中...</div>';

  try {
    const res = await fetch(`${NEWS_API}/api/stock-news?name=${encodeURIComponent(keyword)}&code=${encodeURIComponent(code)}`);
    const rows = await res.json();
    const filtered = normalizeRenderStockNews(rows, code, keyword).slice(0, 10);
    newsCache[cacheKey] = filtered;
    renderStockNews(el, filtered);
  } catch {
    el.innerHTML = '<div style="font-size:11px;color:var(--text3);">⚠️ 新聞載入失敗</div>';
  }
}

function renderStockNews(el, items) {
  if (!items.length) { el.innerHTML = '<div style="font-size:11px;color:var(--text3);">目前無相關新聞</div>'; return; }
  const PREVIEW = 2;
  const renderItem = (n, hidden) => {
    const d = new Date(n.pub);
    const t = isNaN(d) ? '' : d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const display = hidden ? 'none' : 'block';
    const cls = hidden ? ' news-extra' : '';
    return '<a href="' + n.link + '" target="_blank" rel="noopener" class="news-item' + cls + '" style="text-decoration:none;display:' + display + ';margin-bottom:6px;"><div style="padding:8px 10px;background:var(--bg3);border-radius:6px;border:1px solid var(--border);"><div style="font-size:12px;color:var(--text);line-height:1.4;margin-bottom:3px;">' + n.title + '</div><div style="font-size:11px;color:var(--text3);display:flex;gap:8px;"><span style=\'color:var(--accent);\'>' + n.src + '</span><span>' + t + '</span></div></div></a>';
  };
  const allHtml = items.map((n, i) => renderItem(n, i >= PREVIEW)).join('');
  if (items.length <= PREVIEW) { el.innerHTML = allHtml; return; }
  const toggleId = 'toggle-' + Math.random().toString(36).slice(2,8);
  el.innerHTML = allHtml + '<div id="' + toggleId + '" style="text-align:center;padding:6px;cursor:pointer;font-size:12px;color:var(--text3);border:1px dashed var(--border);border-radius:6px;margin-top:4px;">還有 ' + (items.length - PREVIEW) + ' 則新聞 ▼ 點擊展開</div>';
  let expanded = false;
  document.getElementById(toggleId).addEventListener('click', function() {
    expanded = !expanded;
    el.querySelectorAll('.news-extra').forEach(function(a) { a.style.display = expanded ? 'block' : 'none'; });
    this.textContent = expanded ? '▲ 收起，只顯示 2 則' : ('還有 ' + (items.length - PREVIEW) + ' 則新聞 ▼ 點擊展開');
  });
}

// ── 熱門族群 API ───────────────────────────────
function normalizeRenderSectorNews(rows) {
  const list = Array.isArray(rows) ? rows : [];
  const out = [];

  for (const r of list) {
    if (Array.isArray(r.items)) {
      for (const n of r.items) {
        out.push({
          title: n.title || '',
          url: n.link || n.url || '',
          time: n.pub || r.time || '',
          src: n.src || 'Google RSS',
          stocks: Array.isArray(n.stocks) ? n.stocks : [],
          eff: Array.isArray(n.eff) && n.eff.length ? n.eff : null,   // ⚡有效標記（漏搬會讓昨日功能整個瞎掉）
          cat: '熱門族群'
        });
      }
    }
  }

  return out.filter(n => n.title && n.url)
    .sort((a, b) => new Date(b.time) - new Date(a.time))
    .slice(0, 100);
}

// 相對時間「多久前」（1分內=剛剛、60分內=N分鐘前、24hr內=N小時前、再久=N天前）
function relTimeAgo(ts){
  const t = new Date(ts).getTime();
  if (!t || isNaN(t)) return '';
  const diff = Date.now() - t; if (diff < 0) return '剛剛';
  const min = Math.floor(diff/60000);
  if (min < 1) return '剛剛';
  if (min < 60) return `${min} 分鐘前`;
  const hr = Math.floor(min/60);
  if (hr < 24) return `${hr} 小時前`;
  return `${Math.floor(hr/24)} 天前`;
}

// 自己判定：位移 <10px 且 <500ms ＝點擊 → 手動觸發；位移大＝滑動照舊。preventDefault 擋掉合成 click 防重複開頁。
(function () {
  let sx = 0, sy = 0, st = 0, tgt = null;
  document.addEventListener('touchstart', (e) => {
    const card = e.target && e.target.closest ? e.target.closest('.ts-sc,.ts-enter,.ts-pd,.ts-full,.ts-back,.ts-gc,.ts-hb,.ts-row,.ts-ncard,.ts-news,.nav-link') : null;
    if (!card) { tgt = null; return; }
    tgt = card; sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (!tgt) return;
    const t = e.changedTouches[0];
    const moved = Math.hypot(t.clientX - sx, t.clientY - sy);
    const card = tgt; tgt = null;
    if (moved < 10 && Date.now() - st < 500) { e.preventDefault(); card.click(); }
  }, { passive: false });
})();
function tsKwHit(title, kw) {
  if (/^[A-Za-z0-9 ]+$/.test(kw)) return new RegExp('(?<![A-Za-z0-9])' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z0-9])', 'i').test(title);
  return title.includes(kw);
}
function tsDayLabel(d){ return d === 7 ? '近一週' : d === 30 ? '近一個月' : '近三個月'; }
// 母體：⚡有效且在區間內的新聞
function tsEffItems(days) {
  const cut = Date.now() - days * 86400e3;
  return _sectorItems.filter(n => Array.isArray(n.eff) && n.eff.length && n.time && new Date(n.time).getTime() >= cut);
}
function tsFmtD(t){ const d = new Date(t); return isNaN(d) ? '' : `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; }
// 指標股聚合：每則有效新聞的「所有」stocks 各 +1
function tsAggStocks(days) {
  const eff = tsEffItems(days), map = {};
  for (const n of eff) for (const s of (n.stocks || [])) {
    if (!s || !s.code) continue;
    if (!map[s.code]) map[s.code] = { code: s.code, name: s.name || s.code, count: 0, items: [] };
    map[s.code].count++; map[s.code].items.push(n);
  }
  const arr = Object.values(map).sort((a, b) => b.count - a.count || a.code.localeCompare(b.code));
  return { effCount: eff.length, stocks: arr };
}
// 子產業聚合：標題命中即該則歸入（每則 +1，可多重歸類）；代表股＝該題材新聞內出現最多的個股
function tsAggSubs(days) {
  const eff = tsEffItems(days), out = [];
  for (const name in TS_SUB_DICT) {
    const kws = TS_SUB_DICT[name];
    const hit = eff.filter(n => kws.some(k => tsKwHit(String(n.title || ''), k)));
    if (!hit.length) continue;
    const sc = {};
    for (const n of hit) for (const s of (n.stocks || [])) {
      if (!s || !s.code) continue;
      if (!sc[s.code]) sc[s.code] = { code: s.code, name: s.name || s.code, count: 0 };
      sc[s.code].count++;
    }
    const stocksAgg = Object.values(sc).sort((a, b) => b.count - a.count);
    const reps = stocksAgg.slice(0, 4).map(x => x.name);
    const latest = hit.reduce((m, n) => Math.max(m, new Date(n.time).getTime() || 0), 0);
    out.push({ name, count: hit.length, reps, stocksAgg, latest, items: hit.slice().sort((a, b) => new Date(b.time) - new Date(a.time)) });
  }
  return out.sort((a, b) => b.count - a.count || b.latest - a.latest);
}

</div>
<div class="ts-card"><div class="ts-card-t">題材新聞入口 <small>點擊卡片查看該題材相關熱門族群新聞</small><span style="float:right;font-weight:400;font-size:10px;color:var(--text3);">Top 20</span></div>
  <div class="ts-grid">${subs.slice(0, 20).map(s => gc(s, false)).join('')}</div>
</div>` : empty}`;

// ── 新聞頁雙 tab（鉅亨網 / 個股新聞）──────────────
let codeNameMap = null;   // 股號→股名對照表（從 Worker 抓，本地快取）
// 對照表相容新舊格式：舊 = {code:"股名"}；新 = {code:{name,market}}
function cnmName(entry){ return typeof entry === 'string' ? entry : (entry && entry.name) || ''; }
function cnmMarket(entry){ return typeof entry === 'string' ? '' : (entry && entry.market) || ''; }
let cnyesLoaded = false;  // 鉅亨網是否已載入（避免切回重抓）

function initNewsPage() {
  cnyesLoaded = false;
  switchNewsTab('cnyes');  // 預設停鉅亨網
  loadCodeNameMap();       // 背景預載對照表（個股查詢用）
}

function switchNewsTab(which) {
  const tCny = document.getElementById('ntab-cnyes');
  const tStk = document.getElementById('ntab-stock');
  const pCny = document.getElementById('news-pane-cnyes');
  const pStk = document.getElementById('news-pane-stock');
  const desc = document.getElementById('news-page-desc');
  if (!tCny || !tStk) return;
  const isCny = which === 'cnyes';
  tCny.classList.toggle('on', isCny);
  tStk.classList.toggle('on', !isCny);
  if (pCny) pCny.style.display = isCny ? '' : 'none';
  if (pStk) pStk.style.display = isCny ? 'none' : '';
  if (desc) desc.innerHTML = isCny
    ? '即時抓取鉅亨網台股新聞，<span>保存 15 天</span>'
    : '輸入股名或股號，查詢個股新聞（全台股）';
  if (isCny && !cnyesLoaded) { cnyesLoaded = true; fetchCnyes(); }
  if (!isCny) { const i = document.getElementById('stock-search-input'); if (i) setTimeout(()=>i.focus(), 50); }
}

async function loadCodeNameMap() {
  if (codeNameMap) return codeNameMap;
  try {
    const res = await fetch(`${WORKER}/api/code-name-map`);
    codeNameMap = await res.json();
  } catch { codeNameMap = {}; }
  return codeNameMap;
}

async function doStockNewsSearch() {
  const input    = document.getElementById('stock-search-input');
  const resultEl = document.getElementById('stock-news-result');
  if (!input || !resultEl) return;
  const q = input.value.trim();
  if (!q) return;

  // 先用對照表檢查：只能查真實存在的台股，擋掉「大便」這種非股票關鍵字
  await loadCodeNameMap();
  const map = codeNameMap || {};
  const mapReady = Object.keys(map).length > 50;

  let code = '', name = '';
  if (mapReady) {
    if (/^\d{4,6}$/.test(q)) {
      // 純股號：對照表要有這檔
      if (map[q]) { code = q; name = cnmName(map[q]); }
    } else {
      // 股名：先精確比對，再模糊（含關鍵字、至少2字，例：「台積」→台積電）
      const exact = Object.entries(map).find(([c, n]) => cnmName(n) === q);
      if (exact) { code = exact[0]; name = cnmName(exact[1]); }
      else if (q.length >= 2) {
        const fuzzy = Object.entries(map).find(([c, n]) => cnmName(n).includes(q));
        if (fuzzy) { code = fuzzy[0]; name = cnmName(fuzzy[1]); }
      }
    }
    // 對照表裡找不到 → 擋下，不去 Google 亂搜
    if (!code && !name) {
      resultEl.innerHTML = `<div class="stock-search-empty">找不到「${q}」這檔股票<br><span style="font-size:11px;">請輸入正確的台股股名或股號（例：台積電 或 2330）</span></div>`;
      return;
    }
  } else {
    // 對照表還沒載到（極少數）：退回直接用輸入查，不擋（保可用性）
    if (/^\d{4,6}$/.test(q)) code = q; else name = q;
  }
  const keyword = name || code || q;

  resultEl.innerHTML = '<div class="stock-search-empty">📰 查詢中…</div>';
  try {
    const res  = await fetch(`${NEWS_API}/api/stock-news?name=${encodeURIComponent(keyword)}&code=${encodeURIComponent(code)}`);
    const rows = await res.json();
    const items = normalizeRenderStockNews(rows, code, keyword);
    renderStockNewsResult(resultEl, items, code, name || keyword);
  } catch {
    resultEl.innerHTML = '<div class="stock-search-empty">⚠️ 查詢失敗，請稍後再試<br><span style="font-size:11px;">（Render 免費版若休眠中，第一次查詢需等幾秒喚醒）</span></div>';
  }
}

function renderStockNewsResult(el, items, code, name) {
  if (!items || !items.length) {
    el.innerHTML = `<div class="stock-search-empty">找不到「${name||code}」的相關新聞</div>`;
    return;
  }
  const head = `<div class="stock-result-head">
    ${code ? `<span class="stock-result-code">${code}</span>` : ''}
    <span class="stock-result-name">${name||''}</span>
    <span class="stock-result-cnt">共 ${items.length} 則</span>
  </div>`;
  const list = items.map((n,i) => {
    const d = new Date(n.pub);
    const t = isNaN(d) ? '' : d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<a href="${n.link}" target="_blank" rel="noopener" class="stock-news-card" style="animation:fadeIn2 0.2s ease ${i*0.015}s both">
      <div class="stock-news-card-title">${n.title}</div>
      <div class="stock-news-card-meta">
        <span>🕐</span><span style="font-family:'JetBrains Mono',monospace;">${t}</span>
        <span>📋</span><span class="news-source">${n.src||'Google 新聞'}</span>
      </div>
    </a>`;
  }).join('');
  el.innerHTML = head + `<div class="news-list">${list}</div>`;
}

// ── 台股新聞 API ───────────────────────────────
async function fetchCnyes() {
  const statusEl  = document.getElementById('news-sync-status');
  const contentEl = document.getElementById('news-content');
  if (!contentEl) return;
  try {
    const res  = await fetch(`${WORKER}/api/news`);
    const json = await res.json();
    const items = Array.isArray(json) ? json : (json?.items?.data||[]).map(n=>({
      title: n.title,
      time:  new Date(n.publishAt*1000).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
      url:   `https://news.cnyes.com/news/id/${n.newsId}`,
      cat:   (n.categoryName||'').split(',')[0].trim(),
    }));
    if (!items.length) { contentEl.innerHTML='<div class="loading-card">目前無新聞資料</div>'; return; }
    const now = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if (statusEl) statusEl.textContent = `鉅亨網同步完成 ／ ${now} ／ 共 ${items.length} 則`;
    renderNews(contentEl, items);
  } catch(err) {
    if (statusEl) statusEl.textContent = '載入失敗';
    contentEl.innerHTML = `<div class="loading-card">⚠️ 無法載入鉅亨網資料<br><button class="btn btn-primary" style="margin-top:12px;" onclick="fetchCnyes()">重試</button></div>`;
  }
}

async function forceRefreshNews() {
  const statusEl  = document.getElementById('news-sync-status');
  const contentEl = document.getElementById('news-content');
  if (!contentEl) return;
  if (statusEl) statusEl.textContent = '重新整理中...';
  contentEl.innerHTML = '<div class="loading-card">重新整理中...</div>';
  try {
    const res  = await fetch(`${WORKER}/api/news`);   // 重讀 KV（新聞改由 Render 每5分鐘抓進 KV，重整只重新拉一次）
    const json = await res.json();
    const items = Array.isArray(json) ? json : [];
    const now   = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if (statusEl) statusEl.textContent = `重新整理完成 ／ ${now} ／ 共 ${items.length} 則`;
    renderNews(contentEl, items);
  } catch(err) {
    if (statusEl) statusEl.textContent = '重新整理失敗';
  }
}

function renderNews(contentEl, items) {
  contentEl.innerHTML = `<div class="news-list">
  ${items.map((n,i) => {
    const readClass = isRead(n.url) ? 'read' : '';
    return `
  <a href="${n.url}" target="_blank" rel="noopener" style="text-decoration:none;"
    onclick="markRead('${n.url}');this.querySelector('.news-card').classList.add('read')">
    <div class="news-card ${readClass}" style="animation:fadeIn2 0.2s ease ${i*0.015}s both">
      <div class="news-card-title">${n.title}</div>
      <div class="news-card-meta">
        <span>🕐</span>
        <span style="font-family:'JetBrains Mono',monospace;">${n.time||''}</span>
        <span>📋</span>
        <span class="news-source">鉅亨網</span>
        ${n.cat?`<span class="badge badge-sector" style="margin-left:auto;">${n.cat}</span>`:''}
      </div>
    </div>
  </a>`;
  }).join('')}
</div>`;
}

// ── 導航 ───────────────────────────────────────
function goto(page, el) {
  closeTwNews();
  closeSecReader();
  stopIntradayAutoRefresh();
  document.querySelectorAll('.sidebar-link').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.bottom-nav .nav-link').forEach(n=>n.classList.remove('active'));
  if (el) {
    el.classList.add('active');
  } else {
    // 啟動或程式呼叫時沒帶 el：依 page 自動找對應導航標記 active
    document.querySelectorAll(`[onclick*="goto('${page}'"]`).forEach(n=>n.classList.add('active'));
  }

  document.getElementById('main').innerHTML = pages[page]();
  window.scrollTo(0,0);

  // 記住最後一頁
  try { localStorage.setItem('lastPage', page); } catch(e) {}
}

function switchStrategy(s) {
  currentStrategy = s;
  document.querySelectorAll('.iv2-seg button').forEach((b,i)=> b.classList.toggle('on', s==='qj' ? i===0 : i===1));
  clearSel();
  renderAlertsList();
}

startClock();
loadWindGauge();                          // 頁面一載入就顯示風度圖
loadChipIndicators();                     // 開站即載 chip → 任何頁籤停留，頂欄 60 秒內都有「●盤中」即時風度（非風度頁只載資料不畫圖）
setInterval(loadWindGauge, 5 * 60 * 1000); // 每5分鐘刷新顯示(Worker 端30分算一次)
// ── ?search=股號：TG 推播連結跳轉（點了直接到盤中警示並選中該檔）──
const _searchCode = (() => {
  try { return new URLSearchParams(window.location.search).get('search') || ''; } catch(e) { return ''; }
})();
if (/^\d{4,6}$/.test(_searchCode)) {
  goto('intraday');
  // 等 fetchAlerts 把列表載回來後選中該檔（每 0.5 秒試一次，最多 20 次 = 10 秒）
  let _tries = 0;
  const _timer = setInterval(() => {
    _tries++;
    const row = document.querySelector(`tr[data-code="${_searchCode}"]`);
    if (row) {
      clearInterval(_timer);
      try { openNews(_searchCode); row.scrollIntoView({ block: 'center' }); } catch(e) {}
    } else if (_tries >= 20) { clearInterval(_timer); }
  }, 500);
} else {
// 恢復上次的頁面
try {
  const last = localStorage.getItem('lastPage');
  goto(last && pages[last] ? last : 'intraday');
} catch(e) {
  goto('intraday');
}
}
</script>
