<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>強勢股龍珠雷達</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7;
    --bg2: #ffffff;
    --bg3: #f0f2f5;
    --bg4: #e8ebf0;
    --border: #e2e5eb;
    --border2: #c8cdd8;
    --text: #1a1d24;
    --text2: #5a6276;
    --text3: #9aa0b2;
    --green: #00a651;
    --green2: #008a44;
    --green-bg: rgba(0,166,81,0.07);
    --green-bg2: rgba(0,166,81,0.13);
    --red: #d9363e;
    --red2: #b52c33;
    --red-bg: rgba(217,54,62,0.07);
    --red-bg2: rgba(217,54,62,0.13);
    --amber: #c47d00;
    --amber-bg: rgba(196,125,0,0.09);
    --blue: #1a6fcc;
    --blue-bg: rgba(26,111,204,0.08);
    --accent: #2563eb;
    --accent-bg: rgba(37,99,235,0.09);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
    padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
  }

  /* ── 頂部 LOGO BAR ─────────────────────────── */
  nav {
    height: 48px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .nav-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--green);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .nav-logo::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    animation: blink 1.5s infinite;
    flex-shrink: 0;
  }

  @keyframes blink {
    0%,100% { opacity:1; }
    50% { opacity:0.2; }
  }

  /* ── 底部 TAB BAR ──────────────────────────── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: calc(60px + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: stretch;
    z-index: 200;
  }

  .nav-link {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text3);
    border: none;
    background: transparent;
    padding: 6px 2px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .tab-icon  { font-size: 20px; line-height: 1; }
  .tab-label { font-size: 10px; white-space: nowrap; }
  .nav-link.active { color: var(--green); }

  /* ── MAIN ──────────────────────────────────── */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 14px;
  }

  /* ── PAGE HEADER ───────────────────────────── */
  .page-header { margin-bottom: 16px; }

  .page-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .page-desc { font-size: 13px; color: var(--text2); }
  .page-desc span { color: var(--green); font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  /* ── STATUS BAR ────────────────────────────── */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .status-info {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    color: var(--text2);
    flex-wrap: wrap;
  }

  .status-dot { display: flex; align-items: center; gap: 5px; }
  .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dot.green { background: var(--green); }
  .dot.amber { background: var(--amber); }
  .dot.red   { background: var(--red); }
  .status-actions { display: flex; align-items: center; gap: 8px; }

  /* ── BUTTONS ───────────────────────────────── */
  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text);
    transition: all 0.15s;
    font-family: inherit;
  }

  .btn:hover { background: var(--bg4); border-color: var(--accent); }

  .btn-primary {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--blue);
  }

  .btn-primary:hover { background: rgba(91,141,248,0.2); }

  /* ── SORT BAR ──────────────────────────────── */
  .sort-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .sort-label { font-size: 12px; color: var(--text3); }

  .sort-btn {
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    transition: all 0.15s;
    font-family: inherit;
  }

  .sort-btn:hover { border-color: var(--border2); color: var(--text); }
  .sort-btn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--blue); }

  /* ── STOCK CARD ────────────────────────────── */
  .stock-list { display: flex; flex-direction: column; gap: 10px; }

  .stock-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    transition: border-color 0.15s;
  }

  .stock-card.up    { border-left: 3px solid var(--green); }
  .stock-card.limit { border-left: 3px solid var(--red); }

  .stock-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 12px;
  }

  .stock-id { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .stock-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .stock-name { font-size: 14px; font-weight: 500; color: var(--text); }

  .badge {
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }

  .badge-limit  { background: var(--red-bg2);  color: var(--red);   border: 1px solid rgba(255,68,68,0.3); }
  .badge-up     { background: var(--green-bg2); color: var(--green); border: 1px solid rgba(0,230,118,0.3); }
  .badge-sector { background: var(--bg4);       color: var(--text2); border: 1px solid var(--border2); }
  .badge-new    { background: var(--amber-bg);  color: var(--amber); border: 1px solid rgba(255,179,0,0.3); }
  .badge-blue   { background: var(--blue-bg);   color: var(--blue);  border: 1px solid rgba(79,195,247,0.3); }

  .stock-price-area { text-align: right; flex-shrink: 0; }

  .stock-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    color: var(--green);
    line-height: 1;
    margin-bottom: 2px;
  }

  .stock-change { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--green); }

  .stock-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 8px;
  }

  .meta-item { display: flex; align-items: center; gap: 4px; }
  .meta-val  { color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .meta-val.amber { color: var(--amber); }

  /* ── NEWS SNIPPET（盤後用）──────────────────── */
  .news-snippet {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 8px;
  }

  .news-snippet-title { font-size: 13px; color: var(--text); margin-bottom: 4px; line-height: 1.4; }
  .news-snippet-meta  { font-size: 11px; color: var(--text3); display: flex; gap: 8px; }

  /* ── LOADING CARD ──────────────────────────── */
  .loading-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 40px;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
  }

  /* ── AFTER HOURS ───────────────────────────── */
  .after-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .stat-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value { font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--green); }
  .stat-sub   { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* ── SCROLLBAR ─────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ── SYNC BAR ──────────────────────────────── */
  .sync-bar {
    background: var(--green-bg);
    border: 1px solid rgba(0,230,118,0.2);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace;
  }

  .pulse-dot {
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: blink 1.2s infinite;
    flex-shrink: 0;
  }

  /* ── 台股新聞卡片（大字）──────────────────── */
  .news-list { display: flex; flex-direction: column; gap: 10px; }

  .news-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .news-card:hover { border-color: var(--border2); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

  .news-card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .news-card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text3);
    flex-wrap: wrap;
  }

  .news-source { color: var(--accent); font-weight: 500; }

  /* ── 熱門族群卡片（大字）──────────────────── */
  .sector-news-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    margin-bottom: 10px;
  }

  .sector-news-card:hover { border-color: var(--border2); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

  .sector-news-card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.5;
    margin: 10px 0 12px;
  }

  .sector-tag-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .tag-valid {
    padding: 3px 8px;
    background: rgba(196,125,0,0.1);
    color: var(--amber);
    border: 1px solid rgba(196,125,0,0.25);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
  }

  .tag-date {
    padding: 3px 8px;
    background: rgba(37,99,235,0.08);
    color: var(--blue);
    border: 1px solid rgba(37,99,235,0.2);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
  }

  .sector-meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text3);
  }

  /* ── GUIDE ─────────────────────────────────── */
  .guide-content { max-width: 720px; }

  .guide-hero {
    background: linear-gradient(135deg, var(--bg3) 0%, var(--bg4) 100%);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 24px;
  }

  .guide-hero-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .guide-hero-sub   { font-size: 13px; color: var(--text2); }

  .guide-section { margin-bottom: 24px; }

  .guide-section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .guide-section-title::before {
    content: '';
    width: 3px; height: 16px;
    background: var(--green);
    border-radius: 2px;
  }

  .sop-steps { display: flex; flex-direction: column; gap: 10px; }

  .sop-step {
    display: flex;
    gap: 14px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .step-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--accent-bg);
    border: 1px solid var(--accent);
    color: var(--blue);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }

  .step-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .step-desc  { font-size: 13px; color: var(--text2); line-height: 1.6; }

  .exit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }

  .exit-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    border-top: 2px solid var(--red);
  }

  .exit-card-title { font-size: 13px; font-weight: 700; color: var(--red); margin-bottom: 6px; }
  .exit-card-desc  { font-size: 12px; color: var(--text2); line-height: 1.6; }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">強勢股龍珠雷達</div>
</nav>

<main id="main"></main>

<div class="bottom-nav">
  <div class="nav-link active" onclick="goto('intraday',this)">
    <span class="tab-icon">📡</span>
    <span class="tab-label">盤中</span>
  </div>
  <div class="nav-link" onclick="goto('after',this)">
    <span class="tab-icon">🌙</span>
    <span class="tab-label">盤後</span>
  </div>
  <div class="nav-link" onclick="goto('sectors',this)">
    <span class="tab-icon">🔥</span>
    <span class="tab-label">族群</span>
  </div>
  <div class="nav-link" onclick="goto('news',this)">
    <span class="tab-icon">📰</span>
    <span class="tab-label">新聞</span>
  </div>
  <div class="nav-link" onclick="goto('guide',this)">
    <span class="tab-icon">📖</span>
    <span class="tab-label">說明</span>
  </div>
</div>

<script>
const WORKER = 'https://stockradar-worker.lucastockradar.workers.dev';

// ── 全域快取 ────────────────────────────────────
let alertsData    = { qj: [], lz: [], updatedAt: null };
let stocklistData = { stocks: [], updatedAt: null };

// ── 輔助函式 ────────────────────────────────────
function fmtChg(v) {
  return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
}

function condTag(pass, label) {
  const c = pass ? 'rgba(0,166,81' : 'rgba(217,54,62';
  return `<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500;border:1px solid ${c},0.3);background:${c},0.07);color:${pass?'var(--green)':'var(--red)'}">
  ${pass?'✓':'✗'} ${label}
</span>`;
}

// ── 策略一 card（起漲k）────────────────────────
function cardQJ(s, idx) {
  const newsId = `news-qj-${s.code}`;
  return `
<div class="stock-card ${s.limit?'limit':'up'}" style="animation:fadeIn 0.2s ease ${idx*0.04}s both">
  <div class="stock-top">
    <div class="stock-id">
      <span class="stock-code">${s.code}</span>
      <span class="stock-name">${s.name}</span>
      ${s.limit ? '<span class="badge badge-limit">漲停</span>' : '<span class="badge badge-up">強漲</span>'}
      ${s.sector ? `<span class="badge badge-sector">${s.sector}</span>` : ''}
    </div>
    <div class="stock-price-area">
      <div class="stock-price">${(+(s.price||0)).toFixed(1)}</div>
      <div class="stock-change">${fmtChg(+(s.chg||0))}</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:6px 10px;background:rgba(0,166,81,0.06);border-radius:6px;border:1px solid rgba(0,166,81,0.2);">
    <span style="font-size:13px;">✅</span>
    <span style="font-size:12px;font-weight:500;color:var(--green);">09:00–09:15 第一根15分K 紅棒</span>
  </div>
  <div class="stock-meta" style="margin-bottom:10px;">
    <div class="meta-item">⏱ 入榜 <span class="meta-val">${s.time||''}</span></div>
    <div class="meta-item">量 <span class="meta-val amber">${s.vol ? ((s.vol)/1000).toFixed(1)+'千張' : '-'}</span></div>
  </div>
  <div id="${newsId}" style="border-top:1px solid var(--border);padding-top:10px;">
    <div style="font-size:11px;color:var(--text3);">📰 載入個股新聞中...</div>
  </div>
</div>`;
}

// ── 策略二 card（量增k）────────────────────────
function cardLZ(s, idx) {
  const newsId = `news-lz-${s.code}`;
  return `
<div class="stock-card up" style="animation:fadeIn 0.2s ease ${idx*0.04}s both">
  <div class="stock-top">
    <div class="stock-id">
      <span class="stock-code">${s.code}</span>
      <span class="stock-name">${s.name}</span>
      <span class="badge badge-limit">前日漲停</span>
      ${s.sector ? `<span class="badge badge-sector">${s.sector}</span>` : ''}
    </div>
    <div class="stock-price-area">
      <div class="stock-price">${(+(s.price||0)).toFixed(1)}</div>
      <div class="stock-change">${fmtChg(+(s.chg||0))}</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:6px 10px;background:rgba(0,166,81,0.06);border-radius:6px;border:1px solid rgba(0,166,81,0.2);">
    <span style="font-size:13px;">✅</span>
    <span style="font-size:12px;font-weight:500;color:var(--green);">預估量放大中</span>
  </div>
  <div class="stock-meta" style="margin-bottom:10px;">
    <div class="meta-item">⏱ 入榜 <span class="meta-val">${s.time||''}</span></div>
    <div class="meta-item">量 <span class="meta-val amber">${s.vol ? ((s.vol)/1000).toFixed(1)+'千張' : '-'}</span></div>
  </div>
  <div id="${newsId}" style="border-top:1px solid var(--border);padding-top:10px;">
    <div style="font-size:11px;color:var(--text3);">📰 載入個股新聞中...</div>
  </div>
</div>`;
}

// ── 盤後追蹤 card ──────────────────────────────
function cardAfter(s, idx) {
  return `
<div class="stock-card ${s.limit?'limit':'up'}" style="animation:fadeIn 0.2s ease ${idx*0.04}s both">
  <div class="stock-top">
    <div class="stock-id">
      <span class="stock-code">${s.code}</span>
      <span class="stock-name">${s.name}</span>
      ${s.limit ? '<span class="badge badge-limit">漲停收盤</span>' : '<span class="badge badge-up">強漲收盤</span>'}
      ${s.sector ? `<span class="badge badge-sector">${s.sector}</span>` : ''}
    </div>
    <div class="stock-price-area">
      <div class="stock-price">${(+(s.price||0)).toFixed(1)}</div>
      <div class="stock-change">${fmtChg(+(s.chg||0))}</div>
    </div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;">
    ${condTag((+(s.chg||0))>=7,    `收盤漲幅 ${(+(s.chg||0)).toFixed(2)}%`)}

async function fetchAlerts() {
  const listEl = document.getElementById('strategy-list');
  const timeEl = document.getElementById('alerts-time');
  if (!listEl) return;

  try {
    const res = await fetch(`${WORKER}/api/alerts`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    // 相容陣列（舊格式）和 { qj, lz }（新格式）
    if (Array.isArray(data)) {
      alertsData.qj = data;
      alertsData.lz = [];
    } else {
      alertsData.qj = data.qj || [];
      alertsData.lz = data.lz || [];
    }

    const now = new Date().toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if (timeEl) timeEl.textContent = now;
    renderAlertsList();
  } catch(err) {
    console.error('fetchAlerts:', err);
    if (listEl) listEl.innerHTML = `
<div class="loading-card">
  ⚠️ 無法載入警示資料<br>
  <span style="font-size:12px;margin-top:6px;display:block;">${err.message}</span>
  <button class="btn btn-primary" style="margin-top:12px;" onclick="fetchAlerts()">重試</button>
</div>`;
  }
}

function renderAlertsList() {
  const listEl  = document.getElementById('strategy-list');
  const countEl = document.getElementById('alerts-count');
  const limitEl = document.getElementById('alerts-limit');
  if (!listEl) return;

  const isQJ   = currentStrategy === 'qj';
  const stocks = isQJ ? alertsData.qj : alertsData.lz;

  if (countEl) countEl.textContent = stocks.length;
  if (limitEl) limitEl.textContent = isQJ
    ? `漲停 ${stocks.filter(s=>s.limit).length} 檔`
    : `共 ${stocks.length} 檔`;

  if (!stocks.length) {
    listEl.innerHTML = '<div class="loading-card">目前無符合條件的強勢股，盤中每分鐘自動更新</div>';
    return;
  }

  listEl.innerHTML = isQJ
    ? stocks.map((s,i) => cardQJ(s,i)).join('')
    : stocks.map((s,i) => cardLZ(s,i)).join('');

  loadAllStockNews(stocks, isQJ ? 'qj' : 'lz');
}

function renderStockList() {
  const listEl  = document.getElementById('after-list');
  const totalEl = document.getElementById('after-stat-total');
  const limitEl = document.getElementById('after-stat-limit');
  const chgEl   = document.getElementById('after-stat-chg');
  const volEl   = document.getElementById('after-stat-vol');
  const dateEl  = document.getElementById('after-date');
  if (!listEl) return;

  const stocks = stocklistData.stocks;
  if (dateEl && stocklistData.updatedAt) dateEl.textContent = stocklistData.updatedAt;

  if (!stocks.length) {
    listEl.innerHTML = '<div class="loading-card">今日盤後清單尚未產生，將於收盤後自動更新</div>';
    [totalEl,limitEl].forEach(el => { if(el) el.textContent = '0'; });
    [chgEl,volEl].forEach(el => { if(el) el.textContent = '-'; });
    return;
  }

  const limitCount = stocks.filter(s=>s.limit).length;
  const avgChg = (stocks.reduce((a,s)=>a+(+(s.chg||0)),0)/stocks.length).toFixed(2);
  const avgVol = Math.round(stocks.reduce((a,s)=>a+(+(s.vol||0)),0)/stocks.length/1000);

  if (totalEl) totalEl.textContent = stocks.length;
  if (limitEl) limitEl.textContent = limitCount;
  if (chgEl)   chgEl.textContent   = avgChg + '%';
  if (volEl)   volEl.textContent   = avgVol + '千';

  listEl.innerHTML = stocks.map((s,i) => cardAfter(s,i)).join('');
}

// ── Google News RSS：個股新聞 ─────────────────
const newsCache = {};
const NEWS_MEDIA = ['工商時報','鉅亨網','Yahoo','經濟日報','中國時報','時報資訊','旺德富','旺得富','富聯網','時報'];

async function fetchStockNews(code, name, prefix='qj') {
  const el = document.getElementById(`news-${prefix}-${code}`);
  if (!el) return;
  if (newsCache[code]) { renderStockNews(el, newsCache[code]); return; }

  try {
    const PROXY = 'https://corsproxy.io/?url=';
    const query = encodeURIComponent(`${code} ${name} when:7d`);
    const rssUrl = `https://news.google.com/rss/search?q=${query}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
    const res = await fetch(PROXY + encodeURIComponent(rssUrl));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const xml = new DOMParser().parseFromString(await res.text(), 'text/xml');

    const allItems = Array.from(xml.querySelectorAll('item')).map(item => {
      let src = item.querySelector('source')?.textContent || '';
      const rawTitle = item.querySelector('title')?.textContent || '';
      if (!src && rawTitle.includes(' - ')) src = rawTitle.split(' - ').pop().trim();
      const title = rawTitle.includes(' - ') ? rawTitle.split(' - ').slice(0,-1).join(' - ').trim() : rawTitle;
      return { title, link: item.querySelector('link')?.textContent||'#', pub: item.querySelector('pubDate')?.textContent||'', src };
    });

    let filtered = allItems.filter(n => NEWS_MEDIA.some(m => n.src.includes(m)));
    if (filtered.length < 10) {
      filtered = [...filtered, ...allItems.filter(n => !NEWS_MEDIA.some(m => n.src.includes(m)))].slice(0,10);
    } else {
      filtered = filtered.slice(0,10);
    }

    newsCache[code] = filtered;
    renderStockNews(el, filtered);
  } catch(e) {
    el.innerHTML = '<div style="font-size:11px;color:var(--text3);">⚠️ 新聞載入失敗</div>';
  }
}

function renderStockNews(el, items) {
  if (!items.length) { el.innerHTML = '<div style="font-size:11px;color:var(--text3);">目前無相關新聞</div>'; return; }
  el.innerHTML = items.map(n => {
    const d = new Date(n.pub);
    const t = isNaN(d) ? '' : d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<a href="${n.link}" target="_blank" rel="noopener" style="text-decoration:none;display:block;margin-bottom:6px;">
  <div style="padding:8px 10px;background:var(--bg3);border-radius:6px;border:1px solid var(--border);">
    <div style="font-size:12px;color:var(--text);line-height:1.4;margin-bottom:3px;">${n.title}</div>
    <div style="font-size:11px;color:var(--text3);display:flex;gap:8px;">
      <span style="color:var(--accent);">${n.src}</span><span>${t}</span>
    </div>
  </div>
</a>`;
  }).join('');
}

function loadAllStockNews(stocks, prefix='qj') {
  stocks.forEach((s,i) => setTimeout(() => fetchStockNews(s.code, s.name, prefix), i*400));
}

  </div>
  <div class="sector-news-card-title">${n.title}</div>
  <div style="display:inline-flex;align-items:center;gap:5px;padding:3px 8px;background:var(--amber-bg);border-radius:6px;border:1px solid rgba(196,125,0,0.2);font-size:11px;color:var(--amber);font-weight:600;">
    🔥 熱門族群焦點
  </div>
  <div class="sector-meta-row">
    <span>📋</span>
    <span style="color:var(--accent);font-weight:500;">${n.src||'富聯網'}</span>
    <span>🕐</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;">${dateStr}</span>
  </div>
</div>`;
    }).join('') + `<style>@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>`;

  } catch(err) {
    console.error('fetchSectors:', err);
    if (statusEl) statusEl.textContent = '載入失敗，請稍後再試';
    contentEl.innerHTML = `<div class="loading-card">⚠️ 無法載入資料<br><button class="btn btn-primary" style="margin-top:12px;" onclick="fetchSectors()">重試</button></div>`;
  }
}

// ── 台股新聞 API ───────────────────────────────
async function fetchCnyes() {
  const statusEl  = document.getElementById('news-sync-status');
  const contentEl = document.getElementById('news-content');
  if (!contentEl) return;

  try {
    const res = await fetch(`${WORKER}/api/news`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();

    const items = Array.isArray(json) ? json : (json?.items?.data||[]).map(n => ({
      title: n.title,
      time:  new Date(n.publishAt*1000).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
      url:   `https://news.cnyes.com/news/id/${n.newsId}`,
      cat:   (n.categoryName||'').split(',')[0].trim(),
    }));

    if (!items.length) { contentEl.innerHTML = '<div class="loading-card">目前無新聞資料</div>'; return; }

    const now = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if (statusEl) statusEl.textContent = `鉅亨網同步完成 ／ ${now} ／ 共 ${items.length} 則（保存7天）`;

    contentEl.innerHTML = `<div class="news-list">
  ${items.map((n,i) => `
  <a href="${n.url}" target="_blank" rel="noopener" style="text-decoration:none;">
    <div class="news-card" style="animation:fadeIn 0.2s ease ${i*0.02}s both">
      <div class="news-card-title">${n.title}</div>
      <div class="news-card-meta">
        <span>🕐</span>
        <span style="font-family:'JetBrains Mono',monospace;">${n.time}</span>
        <span>📋</span>
        <span class="news-source">鉅亨網</span>
        ${n.cat ? `<span class="badge badge-sector" style="margin-left:auto;">${n.cat}</span>` : ''}
      </div>
    </div>
  </a>`).join('')}
</div>
<style>@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>`;

  } catch(err) {
    console.error('fetchCnyes:', err);
    if (statusEl) statusEl.textContent = '載入失敗，請稍後再試';
    contentEl.innerHTML = `<div class="loading-card">⚠️ 無法載入鉅亨網資料<br><button class="btn btn-primary" style="margin-top:12px;" onclick="fetchCnyes()">重試</button></div>`;
  }
}

// ── 導航 ───────────────────────────────────────
function goto(page, el) {
  document.querySelectorAll('.bottom-nav .nav-link').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('main').innerHTML = pages[page]();
  window.scrollTo(0, 0);
}

function switchStrategy(s) {
  currentStrategy = s;
  document.getElementById('main').innerHTML = pages.intraday();
}

document.addEventListener('click', e => {
  if (e.target.classList.contains('sort-btn')) {
    const p = e.target.closest('.sort-bar');
    if (p) { p.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active')); e.target.classList.add('active'); }
  }
});

goto('intraday');
</script>
